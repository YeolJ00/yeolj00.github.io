<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>머문자리</title>
    <!-- Preload critical fonts so the browser fetches them before CSS parsing -->
    <link rel="preload" href="assets/fonts/SunBatang-Medium.subset.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/NanumGothic.subset.woff2" as="font" type="font/woff2" crossorigin>
    <!-- Pretendard: loaded as stylesheet link (not @import) to avoid render-blocking -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
    <link rel="stylesheet" href="css/styles.css?v=13">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/ko.js"></script>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen">
        <div class="loading-title">머문자리</div>
        <div class="loading-subtitle">우리의 하루하루</div>
        <div class="loading-dots">
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
        </div>
    </div>

    <!-- App -->
    <div id="app">
        <!-- Top cream strip — shrinks/grows between single-month and overview mode -->
        <div class="top-strip" id="top-strip"></div>

        <!-- Header -->
        <header class="header">
            <div class="logo">머문자리</div>
            <div class="header-controls">
                <a href="maps.html" class="header-btn" id="btn-world-map" title="세계 지도">
                    <img src="assets/globe-icon.svg" alt="World" style="width:20px;height:20px;object-fit:contain;filter:invert(35%) sepia(8%) saturate(600%) hue-rotate(10deg) brightness(0.7);">
                </a>
                <a href="maps.html?view=korea" class="header-btn" id="btn-korea-map" title="한국 지도">
                    <img src="assets/korea-icon.svg" alt="Korea" style="width:20px;height:20px;object-fit:contain;filter:invert(35%) sepia(8%) saturate(600%) hue-rotate(10deg) brightness(0.7);">
                </a>
            </div>
        </header>

        <!-- Diary Viewport -->
        <div class="diary-viewport" id="diary-viewport">
            <!-- Single Month View (default) -->
            <div class="month-view" id="month-view">
                <div class="month-view-header" id="month-view-header">
                    <button class="month-title-btn" id="month-title-btn"></button>
                    <div class="month-date-count" id="month-date-count"></div>
                </div>
                <div class="month-view-canvas" id="month-view-canvas">
                    <!-- Date bubbles rendered here -->
                </div>
            </div>

            <!-- All Months Overview (hidden by default) -->
            <div class="months-overview" id="months-overview" style="display:none;">
                <div class="overview-header">
                    <div class="overview-title">전체 보기</div>
                </div>
                <div class="overview-grid" id="overview-grid">
                    <!-- Month cards rendered here -->
                </div>
            </div>
        </div>

        <!-- Month Navigation Bar (bottom) -->
        <div class="month-nav-bar" id="month-nav-bar">
            <button class="month-nav-overview-btn" id="btn-overview" title="전체 보기">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                    <rect x="3" y="3" width="7" height="7" rx="1"/>
                    <rect x="14" y="3" width="7" height="7" rx="1"/>
                    <rect x="3" y="14" width="7" height="7" rx="1"/>
                    <rect x="14" y="14" width="7" height="7" rx="1"/>
                </svg>
            </button>
            <div class="month-nav-pills" id="month-nav-pills">
                <!-- Month buttons rendered here -->
            </div>
        </div>
    </div>

    <!-- Upload FAB -->
    <button class="upload-fab" id="upload-fab" aria-label="새 기록 추가">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="24" height="24">
            <path d="M12 5v14M5 12h14"/>
        </svg>
    </button>

    <script type="module" src="js/diary.js"></script>
</body>
</html>
