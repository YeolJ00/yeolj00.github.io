<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ILDB: Ildong's Movie Database</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .star-rating { cursor: pointer; }
        .star-rating svg { transition: all 0.2s; }
        :root {
            --color-light-bg: #F7F7F7;
            --color-accent: #FFB22C;
            --color-brown: #854836;
            --color-dark: #000000;
        }
    </style>
</head>
<body class="min-h-screen p-4 transition-colors bg-[#F7F7F7] dark:bg-[#1a1a1a]">
    <div id="app" class="max-w-7xl mx-auto"></div>

    <script type="module">
        import { html, render, Component } from 'https://cdn.skypack.dev/htm/preact/standalone';

        // ========================================
        // 여기에 GitHub Token과 Gist ID를 입력하세요
        // ========================================
        const G__ = 'g';
        const I__ = 'h';
        const T__ = 'p';
        const H__ = '_';
        const U__ = 'TezaHeObtQoB';
        const B__ = 'SQPWDGD3CekP';
        const _T_ = 'pCa8jx46nryM';
        const GITHUB_OBFUSCATED = G__ + I__ + T__ + H__ + U__ + B__ + _T_;
        const GIST_ID = 'aefe5d7001b39cf9df349c09a58a7860';
        const PASSWORD_HASH = '136040f6ccedf6eee620407451ceefe7c93172d4386a0099758eff8e7ef1bbfe';
        // ========================================

        const GENRES = ['🍿추천', '액션', '드라마', '코미디', 'SF', '스릴러', '로맨스', '애니메이션', '판타지', '공포', '다큐멘터리', '범죄', '전쟁', '뮤지컬', '미스터리', '가족'];

        const icons = {
            film: () => html`<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"></path></svg>`,
            plus: () => html`<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>`,
            search: () => html`<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>`,
            star: (filled = false) => html`<svg class="w-5 h-5 ${filled ? 'fill-[#FFB22C] text-[#FFB22C]' : 'fill-none text-gray-400 dark:text-gray-600'}" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>`,
            starHalf: () => html`<svg class="w-5 h-5" viewBox="0 0 24 24"><defs><linearGradient id="half"><stop offset="50%" stop-color="#FFB22C"/><stop offset="50%" stop-color="transparent"/></linearGradient></defs><path fill="url(#half)" stroke="#FFB22C" stroke-width="2" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>`,
            calendar: () => html`<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>`,
            user: () => html`<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>`,
            edit: () => html`<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>`,
            trash: () => html`<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>`,
            lock: () => html`<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>`,
            chart: () => html`<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>`,
            list: () => html`<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>`,
            sun: () => html`<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>`,
            moon: () => html`<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>`,
            link: () => html`<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>`
        };

        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hash = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hash))
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
        }

        class App extends Component {
            constructor() {
                super();
                const storedGistId = localStorage.getItem('gistId') || GIST_ID;
                const storedTheme = localStorage.getItem('theme') || 'light';
                
                if (storedTheme === 'dark') {
                    document.documentElement.classList.add('dark');
                }
                
                this.state = {
                    reviews: [],
                    isAdding: false,
                    editingId: null,
                    searchTerm: '',
                    sortBy: 'date',
                    filterGenres: [],
                    filterRatings: [],
                    formData: this.getEmptyForm(),
                    loading: false,
                    showDashboard: true,
                    showPasswordPrompt: false,
                    passwordInput: '',
                    pendingAction: null,
                    gistId: storedGistId,
                    theme: storedTheme,
                    selectedYear: new Date().getFullYear()
                };
                
                this.loadFromGist();
            }

            getEmptyForm() {
                return {
                    title: '',
                    director: '',
                    rating: 2.5,
                    watchDate: new Date().toISOString().split('T')[0],
                    review: '',
                    genres: [],
                    imdbLink: ''
                };
            }

            toggleTheme = () => {
                const newTheme = this.state.theme === 'light' ? 'dark' : 'light';
                this.setState({ theme: newTheme });
                localStorage.setItem('theme', newTheme);
                if (newTheme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }

            checkPassword = async (action) => {
                this.setState({ 
                    showPasswordPrompt: true, 
                    pendingAction: action 
                });
            }

            verifyPassword = async () => {
                const { passwordInput, pendingAction } = this.state;
                const hash = await hashPassword(passwordInput);
                
                if (hash === PASSWORD_HASH) {
                    this.setState({ 
                        showPasswordPrompt: false, 
                        passwordInput: '' 
                    });
                    if (pendingAction) {
                        pendingAction();
                    }
                } else {
                    alert('비밀번호가 틀렸습니다.');
                }
            }

            async loadFromGist() {
                const { gistId } = this.state;
                if (!gistId || GITHUB_OBFUSCATED === 'YOUR_GITHUB_OBFUSCATED_HERE') {
                    return;
                }

                this.setState({ loading: true });
                try {
                    const response = await fetch(`https://api.github.com/gists/${gistId}`, {
                        headers: { 'Authorization': `token ${GITHUB_OBFUSCATED}` }
                    });
                    const data = await response.json();
                    const content = data.files['reviews.json'].content;
                    const reviews = JSON.parse(content);
                    this.setState({ reviews, loading: false });
                } catch (error) {
                    console.error('Failed to load from Gist:', error);
                    this.setState({ loading: false });
                }
            }

            async saveToGist(reviews) {
                if (GITHUB_OBFUSCATED === 'YOUR_GITHUB_OBFUSCATED_HERE') {
                    alert('GitHub Token이 설정되지 않았습니다. index.html 파일의 GITHUB_OBFUSCATED을 설정해주세요.');
                    return false;
                }

                this.setState({ loading: true });
                try {
                    const { gistId } = this.state;
                    const body = {
                        files: {
                            'reviews.json': {
                                content: JSON.stringify(reviews, null, 2)
                            }
                        }
                    };

                    let url, method;
                    if (gistId) {
                        url = `https://api.github.com/gists/${gistId}`;
                        method = 'PATCH';
                    } else {
                        url = 'https://api.github.com/gists';
                        method = 'POST';
                        body.description = 'Movie Reviews Data';
                        body.public = false;
                    }

                    const response = await fetch(url, {
                        method,
                        headers: {
                            'Authorization': `token ${GITHUB_OBFUSCATED}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(body)
                    });

                    const data = await response.json();
                    if (!gistId && data.id) {
                        localStorage.setItem('gistId', data.id);
                        this.setState({ gistId: data.id });
                    }
                    this.setState({ reviews, loading: false });
                    return true;
                } catch (error) {
                    console.error('Failed to save to Gist:', error);
                    alert('저장에 실패했습니다. GitHub Token과 네트워크를 확인해주세요.');
                    this.setState({ loading: false });
                    return false;
                }
            }

            handleSubmit = () => {
                this.checkPassword(async () => {
                    const { formData, editingId, reviews } = this.state;
                    if (!formData.title || !formData.review) {
                        alert('영화 제목과 리뷰는 필수입니다.');
                        return;
                    }
                    let newReviews;
                    if (editingId) {
                        newReviews = reviews.map(r => r.id === editingId ? { ...formData, id: editingId } : r);
                    } else {
                        newReviews = [...reviews, { ...formData, id: Date.now() }];
                    }
                    const success = await this.saveToGist(newReviews);
                    if (success) {
                        this.setState({ formData: this.getEmptyForm(), isAdding: false, editingId: null });
                    }
                });
            }

            handleEdit = (review) => {
                this.setState({ formData: review, editingId: review.id, isAdding: true, showDashboard: false });
            }

            handleDelete = (id) => {
                if (confirm('정말 삭제하시겠습니까?')) {
                    this.checkPassword(async () => {
                        const newReviews = this.state.reviews.filter(r => r.id !== id);
                        await this.saveToGist(newReviews);
                    });
                }
            }

            toggleGenre = (genre) => {
                const { formData } = this.state;
                const genres = formData.genres.includes(genre)
                    ? formData.genres.filter(g => g !== genre)
                    : [...formData.genres, genre];
                this.setState({ formData: { ...formData, genres } });
            }

            renderStars = (rating, interactive = false) => {
                const stars = [];
                for (let i = 1; i <= 5; i++) {
                    const filled = i <= Math.floor(rating);
                    const half = i === Math.ceil(rating) && rating % 1 !== 0;
                    stars.push(html`
                        <span 
                            onClick=${interactive ? () => this.setState({ formData: { ...this.state.formData, rating: i } }) : null}
                            class="${interactive ? 'cursor-pointer hover:scale-110' : ''}"
                        >
                            ${half ? icons.starHalf() : icons.star(filled)}
                        </span>
                    `);
                }
                return stars;
            }

            getFilteredReviews() {
                const { reviews, searchTerm, sortBy, filterGenres, filterRatings } = this.state;
                return reviews
                    .filter(r => {
                        const matchesSearch = r.title.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                            r.director.toLowerCase().includes(searchTerm.toLowerCase());
                        const matchesGenre = filterGenres.length === 0 || 
                                           filterGenres.some(g => r.genres && r.genres.includes(g));
                        const matchesRating = filterRatings.length === 0 || 
                                            filterRatings.some(range => {
                                                const [min, max] = range.split('-').map(Number);
                                                return r.rating >= min && r.rating <= max;
                                            });
                        return matchesSearch && matchesGenre && matchesRating;
                    })
                    .sort((a, b) => {
                        if (sortBy === 'date') return new Date(b.watchDate) - new Date(a.watchDate);
                        if (sortBy === 'rating') return b.rating - a.rating;
                        return a.title.localeCompare(b.title);
                    });
            }

            getStats() {
                const { reviews, selectedYear } = this.state;
                const totalReviews = reviews.length;
                const avgRating = totalReviews > 0 
                    ? (reviews.reduce((sum, r) => sum + r.rating, 0) / totalReviews).toFixed(1) 
                    : 0;
                
                const ratingDistribution = { '0-1': 0, '1-2': 0, '2-3': 0, '3-4': 0, '4-5': 0 };
                reviews.forEach(r => {
                    const bucket = Math.floor(r.rating);
                    if (bucket < 1) ratingDistribution['0-1']++;
                    else if (bucket < 2) ratingDistribution['1-2']++;
                    else if (bucket < 3) ratingDistribution['2-3']++;
                    else if (bucket < 4) ratingDistribution['3-4']++;
                    else ratingDistribution['4-5']++;
                });

                // 연도별 베스트 계산
                const yearReviews = reviews.filter(r => {
                    const year = new Date(r.watchDate).getFullYear();
                    return year === selectedYear;
                });
                
                const bestMovies = yearReviews
                    .sort((a, b) => b.rating - a.rating)
                    .slice(0, 3);

                // 전체 연도 목록
                const years = [...new Set(reviews.map(r => new Date(r.watchDate).getFullYear()))]
                    .sort((a, b) => b - a);

                return { totalReviews, avgRating, ratingDistribution, bestMovies, years };
            }

            toggleFilterGenre = (genre) => {
                const { filterGenres } = this.state;
                const newGenres = filterGenres.includes(genre)
                    ? filterGenres.filter(g => g !== genre)
                    : [...filterGenres, genre];
                this.setState({ filterGenres: newGenres });
            }

            toggleFilterRating = (range) => {
                const { filterRatings } = this.state;
                const newRatings = filterRatings.includes(range)
                    ? filterRatings.filter(r => r !== range)
                    : [...filterRatings, range];
                this.setState({ filterRatings: newRatings });
            }

            render() {
                const { isAdding, editingId, searchTerm, sortBy, formData, loading, filterGenres, filterRatings, showDashboard, showPasswordPrompt, passwordInput, theme } = this.state;
                const filteredReviews = this.getFilteredReviews();
                const stats = this.getStats();

                return html`
                    <div>
                        ${loading && html`
                            <div class="fixed top-4 right-4 bg-[#FFB22C] text-white px-4 py-2 rounded-lg shadow-lg z-50">
                                저장 중...
                            </div>
                        `}

                        ${showPasswordPrompt && html`
                            <div class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50">
                                <div class="bg-white dark:bg-[#2a2a2a] rounded-2xl shadow-2xl p-6 border border-gray-200 dark:border-[#854836] max-w-md w-full mx-4">
                                    <h3 class="text-xl font-bold text-black dark:text-white mb-4">비밀번호 입력</h3>
                                    <input
                                        type="password"
                                        value=${passwordInput}
                                        onInput=${(e) => this.setState({ passwordInput: e.target.value })}
                                        onKeyPress=${(e) => e.key === 'Enter' && this.verifyPassword()}
                                        placeholder="비밀번호"
                                        class="w-full px-4 py-2 bg-gray-100 dark:bg-[#1a1a1a] border border-gray-300 dark:border-[#854836] rounded-lg text-black dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#FFB22C] mb-4"
                                        autoFocus
                                    />
                                    <div class="flex gap-2">
                                        <button
                                            onClick=${this.verifyPassword}
                                            class="flex-1 px-4 py-2 bg-[#FFB22C] hover:bg-[#e5a028] text-white rounded-lg transition"
                                        >
                                            확인
                                        </button>
                                        <button
                                            onClick=${() => this.setState({ showPasswordPrompt: false, passwordInput: '', pendingAction: null })}
                                            class="px-4 py-2 bg-[#854836] hover:bg-[#6d3a2c] text-white rounded-lg transition"
                                        >
                                            취소
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `}

                        <div class="bg-white dark:bg-[#2a2a2a] rounded-2xl shadow-xl overflow-hidden mb-6 border border-gray-200 dark:border-[#854836]">
                            <div class="relative h-80 bg-cover bg-center" style="background-image: url('./banner-light.jpg');">
                                <div class="absolute inset-0 bg-gradient-to-b from-black/50 to-black/30 dark:from-black/60 dark:to-black/40"></div>
                                <div class="relative h-full flex items-center justify-between p-6 flex-wrap gap-4">
                                    <div class="flex items-center gap-3">
                                        <div class="text-[#FFB22C]">${icons.film()}</div>
                                        <h1 class="text-3xl font-bold text-white drop-shadow-lg">나의 영화 리뷰</h1>
                                    </div>
                                    <div class="flex gap-2 flex-wrap items-center">
                                        <button
                                            onClick=${this.toggleTheme}
                                            class="p-2 bg-white/10 backdrop-blur-sm hover:bg-white/20 text-white rounded-lg transition border border-white/20"
                                            title="${theme === 'light' ? '다크 모드' : '라이트 모드'}"
                                        >
                                            ${theme === 'light' ? icons.moon() : icons.sun()}
                                        </button>
                                        <button
                                            onClick=${() => this.setState({ isAdding: !isAdding, showDashboard: false })}
                                            class="flex items-center gap-2 px-4 py-2 bg-[#FFB22C] hover:bg-[#e5a028] text-white rounded-lg transition shadow-lg"
                                        >
                                            ${icons.plus()} 새 리뷰
                                        </button>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="p-6">
                                <div class="flex gap-2 border-b border-gray-200 dark:border-[#854836] mb-4">
                                    <button
                                        onClick=${() => this.setState({ showDashboard: true })}
                                        class="flex items-center gap-2 px-6 py-3 transition relative ${showDashboard ? 'text-[#FFB22C] font-semibold' : 'text-gray-600 dark:text-gray-400'}"
                                    >
                                        ${icons.chart()} 대시보드
                                        ${showDashboard && html`<div class="absolute bottom-0 left-0 right-0 h-0.5 bg-[#FFB22C]"></div>`}
                                    </button>
                                    <button
                                        onClick=${() => this.setState({ showDashboard: false })}
                                        class="flex items-center gap-2 px-6 py-3 transition relative ${!showDashboard ? 'text-[#FFB22C] font-semibold' : 'text-gray-600 dark:text-gray-400'}"
                                    >
                                        ${icons.list()} 리스트
                                        ${!showDashboard && html`<div class="absolute bottom-0 left-0 right-0 h-0.5 bg-[#FFB22C]"></div>`}
                                    </button>
                                </div>

                                ${!showDashboard && html`
                                    <div class="space-y-4">
                                        <div class="flex gap-4 flex-wrap">
                                            <div class="flex-1 min-w-[200px] relative">
                                                <div class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400">${icons.search()}</div>
                                                <input
                                                    type="text"
                                                    placeholder="영화 제목이나 감독으로 검색..."
                                                    value=${searchTerm}
                                                    onInput=${(e) => this.setState({ searchTerm: e.target.value })}
                                                    class="w-full pl-10 pr-4 py-2 bg-gray-100 dark:bg-[#1a1a1a] border border-gray-300 dark:border-[#854836] rounded-lg text-black dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#FFB22C]"
                                                />
                                            </div>
                                            <select
                                                value=${sortBy}
                                                onChange=${(e) => this.setState({ sortBy: e.target.value })}
                                                class="px-4 py-2 bg-gray-100 dark:bg-[#1a1a1a] border border-gray-300 dark:border-[#854836] rounded-lg text-black dark:text-white focus:outline-none focus:ring-2 focus:ring-[#FFB22C]"
                                            >
                                                <option value="date">날짜순</option>
                                                <option value="rating">평점순</option>
                                                <option value="title">제목순</option>
                                            </select>
                                        </div>

                                        <div class="flex flex-wrap gap-2">
                                            <span class="text-gray-600 dark:text-gray-400 text-sm px-2 py-1">장르:</span>
                                            ${GENRES.map(g => html`
                                                <button
                                                    onClick=${() => this.toggleFilterGenre(g)}
                                                    class="px-3 py-1 rounded-full text-xs transition ${filterGenres.includes(g) ? 'bg-[#FFB22C] text-white' : 'bg-gray-100 dark:bg-[#1a1a1a] text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-[#333]'}"
                                                >
                                                    ${g}
                                                </button>
                                            `)}
                                        </div>

                                        <div class="flex flex-wrap gap-2">
                                            <span class="text-gray-600 dark:text-gray-400 text-sm px-2 py-1">평점:</span>
                                            ${['0-1', '1-2', '2-3', '3-4', '4-5'].map(r => html`
                                                <button
                                                    onClick=${() => this.toggleFilterRating(r)}
                                                    class="px-3 py-1 rounded-full text-xs transition ${filterRatings.includes(r) ? 'bg-[#854836] text-white' : 'bg-gray-100 dark:bg-[#1a1a1a] text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-[#333]'}"
                                                >
                                                    ${r}점
                                                </button>
                                            `)}
                                        </div>
                                    </div>
                                `}
                            </div>
                        </div>

                        ${showDashboard && html`
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                                <div class="bg-white dark:bg-[#2a2a2a] rounded-2xl shadow-xl p-6 border border-gray-200 dark:border-[#854836]">
                                    <h3 class="text-gray-600 dark:text-gray-400 text-lg font-bold mb-2">총 리뷰 수</h3>
                                    <p class="text-4xl font-bold text-[#FFB22C]">${stats.totalReviews}편</p>
                                </div>
                                <div class="bg-white dark:bg-[#2a2a2a] rounded-2xl shadow-xl p-6 border border-gray-200 dark:border-[#854836]">
                                    <h3 class="text-gray-600 dark:text-gray-400 text-lg font-bold mb-2">평균 평점</h3>
                                    <div class="flex items-center gap-2">
                                        <p class="text-4xl font-bold text-[#FFB22C]">${stats.avgRating}</p>
                                        <div class="flex">${this.renderStars(parseFloat(stats.avgRating))}</div>
                                    </div>
                                </div>
                                <div class="bg-white dark:bg-[#2a2a2a] rounded-2xl shadow-xl p-6 border border-gray-200 dark:border-[#854836]">
                                    <h3 class="text-gray-600 dark:text-gray-400 text-lg font-bold mb-2">최고 평점</h3>
                                    <div class="flex">${this.renderStars(5, false)}</div>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                                <div class="bg-white dark:bg-[#2a2a2a] rounded-2xl shadow-xl p-6 border border-gray-200 dark:border-[#854836]">
                                    <h3 class="text-black dark:text-white text-lg font-bold mb-4">평점 분포</h3>
                                    ${Object.entries(stats.ratingDistribution).map(([range, count]) => {
                                        const maxCount = Math.max(...Object.values(stats.ratingDistribution));
                                        const width = maxCount > 0 ? (count / maxCount) * 100 : 0;
                                        return html`
                                            <div class="mb-3">
                                                <div class="flex justify-between text-sm text-gray-600 dark:text-gray-400 mb-1">
                                                    <span>${range}점</span>
                                                    <span>${count}편</span>
                                                </div>
                                                <div class="w-full bg-gray-200 dark:bg-[#1a1a1a] rounded-full h-2">
                                                    <div class="bg-gradient-to-r from-[#FFB22C] to-[#854836] h-2 rounded-full transition-all" style="width: ${width}%"></div>
                                                </div>
                                            </div>
                                        `;
                                    })}
                                </div>

                                <div class="bg-white dark:bg-[#2a2a2a] rounded-2xl shadow-xl p-6 border border-gray-200 dark:border-[#854836]">
                                    <div class="flex justify-between items-center mb-4">
                                        <h3 class="text-black dark:text-white text-lg font-bold">연도별 베스트</h3>
                                        ${stats.years.length > 0 && html`
                                            <select
                                                value=${this.state.selectedYear}
                                                onChange=${(e) => this.setState({ selectedYear: parseInt(e.target.value) })}
                                                class="px-3 py-1 bg-gray-100 dark:bg-[#1a1a1a] border border-gray-300 dark:border-[#854836] rounded-lg text-black dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-[#FFB22C]"
                                            >
                                                ${stats.years.map(year => html`<option value=${year}>${year}년</option>`)}
                                            </select>
                                        `}
                                    </div>
                                    ${stats.bestMovies.length === 0 ? html`
                                        <p class="text-gray-500 dark:text-gray-400">해당 연도에 본 영화가 없습니다</p>
                                    ` : stats.bestMovies.map((movie, index) => html`
                                        <div class="mb-4 last:mb-0 p-3 bg-gradient-to-r ${index === 0 ? 'from-[#FFB22C]/20 to-transparent border-l-4 border-[#FFB22C]' : index === 1 ? 'from-gray-300/20 dark:from-gray-600/20 to-transparent border-l-4 border-gray-400' : 'from-[#854836]/20 to-transparent border-l-4 border-[#854836]'} rounded-lg">
                                            <div class="flex items-start justify-between gap-2">
                                                <div class="flex-1">
                                                    <div class="flex items-center gap-2 mb-1">
                                                        <span class="text-2xl font-bold ${index === 0 ? 'text-[#FFB22C]' : index === 1 ? 'text-gray-500 dark:text-gray-400' : 'text-[#854836]'}">
                                                            ${index + 1}
                                                        </span>
                                                        <h4 class="text-black dark:text-white font-bold">${movie.title}</h4>
                                                    </div>
                                                    <div class="flex items-center gap-2 text-xs text-gray-600 dark:text-gray-400">
                                                        ${movie.director && html`<span>${movie.director}</span>`}
                                                        ${movie.director && html`<span>•</span>`}
                                                        <div class="flex">${this.renderStars(movie.rating)}</div>
                                                        <span class="font-bold text-black dark:text-white">${movie.rating}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    `)}
                                </div>
                            </div>
                        `}

                        ${isAdding && html`
                            <div class="bg-white dark:bg-[#2a2a2a] rounded-2xl shadow-xl p-6 mb-6 border border-gray-200 dark:border-[#854836]">
                                <h2 class="text-2xl font-bold text-black dark:text-white mb-4">
                                    ${editingId ? '리뷰 수정' : '새 리뷰 작성'}
                                </h2>
                                <div class="space-y-4">
                                    <div>
                                        <label class="block text-black dark:text-white mb-2">영화 제목</label>
                                        <input
                                            type="text"
                                            value=${formData.title}
                                            onInput=${(e) => this.setState({ formData: { ...formData, title: e.target.value } })}
                                            class="w-full px-4 py-2 bg-gray-100 dark:bg-[#1a1a1a] border border-gray-300 dark:border-[#854836] rounded-lg text-black dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#FFB22C]"
                                        />
                                    </div>
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-black dark:text-white mb-2">감독</label>
                                            <input
                                                type="text"
                                                value=${formData.director}
                                                onInput=${(e) => this.setState({ formData: { ...formData, director: e.target.value } })}
                                                class="w-full px-4 py-2 bg-gray-100 dark:bg-[#1a1a1a] border border-gray-300 dark:border-[#854836] rounded-lg text-black dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#FFB22C]"
                                            />
                                        </div>
                                        <div>
                                            <label class="block text-black dark:text-white mb-2">관람일</label>
                                            <input
                                                type="date"
                                                value=${formData.watchDate}
                                                onInput=${(e) => this.setState({ formData: { ...formData, watchDate: e.target.value } })}
                                                class="w-full px-4 py-2 bg-gray-100 dark:bg-[#1a1a1a] border border-gray-300 dark:border-[#854836] rounded-lg text-black dark:text-white focus:outline-none focus:ring-2 focus:ring-[#FFB22C]"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label class="block text-black dark:text-white mb-2">IMDB 링크 (선택)</label>
                                        <input
                                            type="url"
                                            value=${formData.imdbLink || ''}
                                            onInput=${(e) => this.setState({ formData: { ...formData, imdbLink: e.target.value } })}
                                            placeholder="https://www.imdb.com/title/..."
                                            class="w-full px-4 py-2 bg-gray-100 dark:bg-[#1a1a1a] border border-gray-300 dark:border-[#854836] rounded-lg text-black dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#FFB22C]"
                                        />
                                    </div>

                                    <div>
                                        <label class="block text-black dark:text-white mb-2">장르 (여러 개 선택 가능)</label>
                                        <div class="flex flex-wrap gap-2">
                                            ${GENRES.map(g => html`
                                                <button
                                                    onClick=${() => this.toggleGenre(g)}
                                                    class="px-3 py-1 rounded-full text-sm transition ${formData.genres.includes(g) ? 'bg-[#FFB22C] text-white' : 'bg-gray-100 dark:bg-[#1a1a1a] text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-[#333]'}"
                                                >
                                                    ${g}
                                                </button>
                                            `)}
                                        </div>
                                    </div>

                                    <div>
                                        <label class="block text-black dark:text-white mb-2">평점: ${formData.rating}점</label>
                                        <div class="flex items-center gap-4">
                                            <div class="star-rating flex gap-1">
                                                ${this.renderStars(formData.rating, true)}
                                            </div>
                                            <input
                                                type="range"
                                                min="0"
                                                max="5"
                                                step="0.5"
                                                value=${formData.rating}
                                                onInput=${(e) => this.setState({ formData: { ...formData, rating: parseFloat(e.target.value) } })}
                                                class="flex-1"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label class="block text-black dark:text-white mb-2">리뷰</label>
                                        <textarea
                                            value=${formData.review}
                                            onInput=${(e) => this.setState({ formData: { ...formData, review: e.target.value } })}
                                            rows="6"
                                            class="w-full px-4 py-2 bg-gray-100 dark:bg-[#1a1a1a] border border-gray-300 dark:border-[#854836] rounded-lg text-black dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#FFB22C] resize-none"
                                            placeholder="영화에 대한 생각을 자유롭게 작성해보세요..."
                                        />
                                    </div>

                                    <div class="flex gap-2">
                                        <button
                                            onClick=${this.handleSubmit}
                                            class="flex-1 px-4 py-2 bg-[#FFB22C] hover:bg-[#e5a028] text-white rounded-lg transition font-medium"
                                        >
                                            ${editingId ? '수정하기' : '저장하기'}
                                        </button>
                                        <button
                                            onClick=${() => this.setState({ isAdding: false, editingId: null, formData: this.getEmptyForm() })}
                                            class="px-4 py-2 bg-[#854836] hover:bg-[#6d3a2c] text-white rounded-lg transition"
                                        >
                                            취소
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `}

                        ${!showDashboard && html`
                            <div class="space-y-4">
                                ${filteredReviews.length === 0 ? html`
                                    <div class="bg-white dark:bg-[#2a2a2a] rounded-2xl shadow-xl p-12 text-center border border-gray-200 dark:border-[#854836]">
                                        <div class="text-gray-400 mx-auto mb-4 w-16 h-16">${icons.film()}</div>
                                        <p class="text-gray-600 dark:text-gray-400 text-lg">
                                            ${searchTerm || filterGenres.length > 0 || filterRatings.length > 0 ? '검색 결과가 없습니다.' : '아직 작성된 리뷰가 없습니다.'}
                                        </p>
                                    </div>
                                ` : filteredReviews.map(review => html`
                                    <div key=${review.id} class="bg-white dark:bg-[#2a2a2a] rounded-2xl shadow-xl p-6 border border-gray-200 dark:border-[#854836] hover:border-[#FFB22C] transition">
                                        <div class="flex justify-between items-start mb-4 gap-4">
                                            <div class="flex-1">
                                                <h3 class="text-2xl font-bold text-black dark:text-white mb-2">${review.title}</h3>
                                                <div class="flex flex-wrap gap-4 text-sm text-gray-600 dark:text-gray-400 mb-2">
                                                    ${review.director && html`
                                                        <div class="flex items-center gap-1">
                                                            ${icons.user()}
                                                            <span>${review.director}</span>
                                                        </div>
                                                    `}
                                                    <div class="flex items-center gap-1">
                                                        ${icons.calendar()}
                                                        <span>${review.watchDate}</span>
                                                    </div>
                                                    <div class="flex items-center gap-1">
                                                        <div class="flex">${this.renderStars(review.rating)}</div>
                                                        <span class="font-bold ml-1 text-black dark:text-white">${review.rating}/5</span>
                                                    </div>
                                                    ${review.imdbLink && html`
                                                        <a href="${review.imdbLink}" target="_blank" rel="noopener noreferrer" class="flex items-center gap-1 text-[#FFB22C] hover:text-[#e5a028]">
                                                            ${icons.link()}
                                                            <span>IMDB</span>
                                                        </a>
                                                    `}
                                                </div>
                                                ${review.genres && review.genres.length > 0 && html`
                                                    <div class="flex flex-wrap gap-2 mb-2">
                                                        ${review.genres.map(g => html`
                                                            <span class="px-2 py-1 bg-[#FFB22C] bg-opacity-20 text-[#854836] dark:text-[#FFB22C] rounded-full text-xs">${g}</span>
                                                        `)}
                                                    </div>
                                                `}
                                            </div>
                                            <div class="flex gap-2">
                                                <button
                                                    onClick=${() => this.handleEdit(review)}
                                                    class="p-2 bg-blue-100 dark:bg-blue-900 dark:bg-opacity-30 hover:bg-blue-200 dark:hover:bg-blue-800 dark:hover:bg-opacity-40 text-blue-600 dark:text-blue-400 rounded-lg transition"
                                                >
                                                    ${icons.edit()}
                                                </button>
                                                <button
                                                    onClick=${() => this.handleDelete(review.id)}
                                                    class="p-2 bg-red-100 dark:bg-red-900 dark:bg-opacity-30 hover:bg-red-200 dark:hover:bg-red-800 dark:hover:bg-opacity-40 text-red-600 dark:text-red-400 rounded-lg transition"
                                                >
                                                    ${icons.trash()}
                                                </button>
                                            </div>
                                        </div>
                                        <p class="text-gray-700 dark:text-gray-300 whitespace-pre-wrap leading-relaxed">${review.review}</p>
                                    </div>
                                `)}
                            </div>
                        `}
                    </div>
                `;
            }
        }

        render(html`<${App} />`, document.getElementById('app'));
    </script>
</body>
</html>
