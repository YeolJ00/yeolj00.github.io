<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>SVG Animation</title>
  <style>
    /* Simplified coin animation without @property dependency */
    .coin {
      transform-origin: center;
      transform-box: fill-box;
      animation: coin-flip 2s ease-in-out forwards;
    }
    
    @keyframes coin-flip {
      0% {
        transform: translate(0px, -150px) scaleX(1);
        opacity: 1;
      }
      /* First flip - compress vertically (edge view) */
      15% {
        transform: translate(-2px, -90px) scaleX(0.1);
        opacity: 1;
      }
      /* Back to full */
      30% {
        transform: translate(-3px, -30px) scaleX(1);
        opacity: 1;
      }
      /* Second flip */
      45% {
        transform: translate(-5px, 30px) scaleX(0.1);
        opacity: 1;
      }
      /* Back to full, approaching slot */
      60% {
        transform: translate(-6px, 90px) scaleX(1);
        opacity: 1;
      }
      /* Insert into slot - scale down */
      75% {
        transform: translate(-6px, 120px) scale(0.85);
        opacity: 1;
      }
      /* Vanish */
      90% {
        transform: translate(-6px, 130px) scale(0.6);
        opacity: 0.3;
      }
      100% {
        transform: translate(-6px, 130px) scale(0.4);
        opacity: 0;
      }
    }
    
    /* Shadow animation */
    .coin_shadow {
      transform-origin: center;
      transform-box: fill-box;
      animation: shadow-anim 2s ease-in-out forwards;
    }
    
    @keyframes shadow-anim {
      0% {
        transform: translate(0px, -110px) scale(0.5, 0.3);
        opacity: 0.1;
      }
      60% {
        transform: translate(-6px, 130px) scale(1.2, 0.4);
        opacity: 0.3;
      }
      90% {
        transform: translate(-6px, 140px) scale(0.8, 0.3);
        opacity: 0.2;
      }
      100% {
        transform: translate(-6px, 140px) scale(0.6, 0.2);
        opacity: 0;
      }
    }
    
    /* Pig body squash */
    .pig_body {
      transform-origin: 50% 60%;
      transform-box: fill-box;
      animation: body-squash 2s ease-in-out forwards;
    }
    
    @keyframes body-squash {
      0%, 70% {
        transform: scale(1, 1);
      }
      75% {
        transform: scale(1.04, 0.96) translateY(3px);
      }
      85% {
        transform: scale(0.98, 1.02) translateY(-2px);
      }
      100% {
        transform: scale(1, 1) translateY(0);
      }
    }
    
    /* Slot animation */
    .pig_slot {
      transform-origin: center;
      transform-box: fill-box;
      animation: slot-anim 2s ease-out forwards;
    }
    
    @keyframes slot-anim {
      0%, 70% {
        transform: scaleY(1);
      }
      75% {
        transform: scaleY(1.15);
      }
      90% {
        transform: scaleY(1);
      }
      100% {
        transform: scaleY(1);
      }
    }
    
    /* Eye blink */
    .pig_eye {
      transform-origin: center;
      transform-box: fill-box;
      animation: eye-blink 2s ease-in-out forwards;
    }
    
    @keyframes eye-blink {
      0%, 72% {
        transform: scaleY(1);
      }
      75% {
        transform: scaleY(0.2);
      }
      80% {
        transform: scaleY(1.1);
      }
      100% {
        transform: scaleY(1);
      }
    }
    
    /* Ear twitch */
    .pig_ear {
      transform-origin: 72% 68%;
      transform-box: fill-box;
      animation: ear-twitch 2s ease-out forwards;
    }
    
    @keyframes ear-twitch {
      0%, 72% {
        transform: rotate(0deg);
      }
      75% {
        transform: rotate(-8deg);
      }
      80% {
        transform: rotate(5deg);
      }
      100% {
        transform: rotate(0deg);
      }
    }
    
    /* Feet bounce */
    .pig_feet {
      transform-origin: center;
      transform-box: fill-box;
      animation: feet-bounce 2s ease-out forwards;
    }
    
    @keyframes feet-bounce {
      0%, 72% {
        transform: translateY(0);
      }
      75% {
        transform: translateY(-3px);
      }
      82% {
        transform: translateY(1px);
      }
      100% {
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <svg class="icon" height="800px" version="1.1" viewbox="0 0 1024 1024" width="800px" xmlns="http://www.w3.org/2000/svg">

      </g>
      <g class="pig_slot-group">
        <path class="icon pig_slot" d="M581.3 418H427.8c-2.9 0-5.3-2.4-5.3-5.3v-42.8c0-2.9 2.4-5.3 5.3-5.3h153.5c2.9 0 5.3 2.4 5.3 5.3v42.8c0.1 2.9-2.3 5.3-5.3 5.3z" fill="#444444"/>
      </g>
      <g class="coin-group">
        <!-- Coin -->
        <circle class="icon coin" cx="513.13777778" cy="169.81333333" r="107.29244445" fill="#FFDA00"/>
      </g>
    </g>
  </svg>
</body>
</html>
