<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   SVG Animation
  </title>
  <style>
   /* 
  Cloud_main "no-motion" composer
  - We declare the necessary @property lanes once and compose the visual state from them.
  - Keyframes are intentionally identity (no visual change) so the cloud body remains visually stable
    while other elements (bolt, drops) animate. This satisfies "no animation" visually but keeps
    lanes and timing available and harmonised with the scene.
  - transform is applied in the composer rule (outside @keyframes) and reads the custom properties.
  - Be mindful: @keyframes only changes custom properties (no direct transform inside keyframes).
*/

/* --- lane/property declarations (add once) --- */
@property --cloud_main-tx1 {
  syntax: "<length>";
  inherits: false;
  initial-value: 0px;
}
@property --cloud_main-ty1 {
  syntax: "<length>";
  inherits: false;
  initial-value: 0px;
}
@property --cloud_main-rot1 {
  syntax: "<angle>";
  inherits: false;
  initial-value: 0deg;
}
@property --cloud_main-sx1 {
  syntax: "<number>";
  inherits: false;
  initial-value: 1;
}
@property --cloud_main-sy1 {
  syntax: "<number>";
  inherits: false;
  initial-value: 1;
}
@property --cloud_main-op1 {
  syntax: "<number>";
  inherits: false;
  initial-value: 1;
}
@property --cloud_main-bright1 {
  syntax: "<number>";
  inherits: false;
  initial-value: 1;
}

/* --- identity keyframes (kept neutral to avoid visual motion) --- */
/* Opacity lane: kept constant so cloud remains visually stable */
@keyframes cloud_main_idle_opacity {
  0%   { --cloud_main-op1: 1; }
  100% { --cloud_main-op1: 1; }
}

/* Brightness lane: kept constant; available for subtle sync if later needed */
@keyframes cloud_main_idle_brightness {
  0%   { --cloud_main-bright1: 1; }
  100% { --cloud_main-bright1: 1; }
}

/* --- composer rule for the cloud_main path --- */
/* transform-origin derived from group data-center-relative ≈ (12.85,27.45) on 64x64 viewBox:
   x% = 12.85/64 ≈ 20.1%, y% = 27.45/64 ≈ 42.9% so we use 20% 43% to anchor transforms. */
.cloud_main {
  /* ensure transforms are relative to the cloud shape */
  transform-box: fill-box;
  transform-origin: 20% 43%;

  /* Compose the visual state from lanes. Keep values neutral (no perceptible motion). */
  /* Use translate/rotate/scale from custom properties (no direct keyframe transform). */
  transform: translate(var(--cloud_main-tx1, 0px), var(--cloud_main-ty1, 0px))
             rotate(var(--cloud_main-rot1, 0deg))
             scale(var(--cloud_main-sx1, 1), var(--cloud_main-sy1, 1));

  opacity: var(--cloud_main-op1, 1);
  /* brightness used to preserve contrast without moving the cloud — default 1 */
  filter: brightness(var(--cloud_main-bright1, 1));

  /* Performance: hint which properties may change (even though they are neutral here). */
  will-change: transform, opacity, filter;

  /* Start the neutral animations immediately so they run in harmony with other elements.
     Longhand animation properties used and ordered to align indexes across lanes. */
  animation-name: cloud_main_idle_opacity, cloud_main_idle_brightness;
  animation-duration: 2.8s, 3.2s;               /* durations chosen to sit harmoniously with nearby motions */
  animation-timing-function: cubic-bezier(.4,0,.2,1), cubic-bezier(.4,0,.2,1);
  animation-delay: 0s, 0s;
  animation-iteration-count: infinite, infinite;
  animation-direction: normal, normal;
  animation-fill-mode: both, both;
  animation-play-state: running, running;
}

/* Comment:
   - The cloud is intentionally held visually stable to avoid interfering with the lightning bolt and drops.
   - Lanes are present and active but neutral; if later tweaks are required to add a subtle parallax or micro-breathe,
     the same lanes can be animated without changing element markup or compositing strategy.
*/

/* cloud_outline: neutral "no-motion" composer using lanes so the outline remains visually static
   - Lanes are active (identity keyframes) so timing/synchronisation is available and harmonised
     with nearby motion (cloud_main, lightning, drops) without introducing visible movement.
   - Transform-origin computed from group's data-center-relative (≈24.25,29.75 on 64x64 box)
     => ~38% 46.5% to anchor any future micro-transforms to the cloud's natural pivot.
   - All keyframes only mutate custom properties (no direct transform inside keyframes).
   - Added once; names chosen to avoid collisions with existing keyframes.
*/

/* --- property declarations (add once for cloud_outline lanes) --- */
@property --cloud_outline-tx1 {
  syntax: "<length>";
  inherits: false;
  initial-value: 0px;
}
@property --cloud_outline-ty1 {
  syntax: "<length>";
  inherits: false;
  initial-value: 0px;
}
@property --cloud_outline-rot1 {
  syntax: "<angle>";
  inherits: false;
  initial-value: 0deg;
}
@property --cloud_outline-sx1 {
  syntax: "<number>";
  inherits: false;
  initial-value: 1;
}
@property --cloud_outline-sy1 {
  syntax: "<number>";
  inherits: false;
  initial-value: 1;
}
@property --cloud_outline-op1 {
  syntax: "<number>";
  inherits: false;
  initial-value: 1;
}
@property --cloud_outline-blur1 {
  /* blur is a length used in filter: blur() */
  syntax: "<length>";
  inherits: false;
  initial-value: 0px;
}
@property --cloud_outline-stroke1 {
  syntax: "<number>";
  inherits: false;
  initial-value: 1;
}
@property --cloud_outline-bright1 {
  syntax: "<number>";
  inherits: false;
  initial-value: 1;
}

/* --- identity keyframes (keep lanes neutral but active for harmony) --- */
/* Transform lane (kept neutral so outline does not shift) */
@keyframes cloud_outline_idle_transform {
  0%   { --cloud_outline-tx1: 0px; --cloud_outline-ty1: 0px; --cloud_outline-rot1: 0deg; --cloud_outline-sx1: 1; --cloud_outline-sy1: 1; }
  100% { --cloud_outline-tx1: 0px; --cloud_outline-ty1: 0px; --cloud_outline-rot1: 0deg; --cloud_outline-sx1: 1; --cloud_outline-sy1: 1; }
}

/* Opacity lane (neutral) */
@keyframes cloud_outline_idle_opacity {
  0%   { --cloud_outline-op1: 1; }
  100% { --cloud_outline-op1: 1; }
}

/* Brightness lane (neutral) */
@keyframes cloud_outline_idle_brightness {
  0%   { --cloud_outline-bright1: 1; }
  100% { --cloud_outline-bright1: 1; }
}

/* Blur lane (neutral - kept at 0 to avoid softening the crisp outline) */
@keyframes cloud_outline_idle_blur {
  0%   { --cloud_outline-blur1: 0px; }
  100% { --cloud_outline-blur1: 0px; }
}

/* Stroke lane (neutral; available to subtly modulate stroke-thickness if needed) */
@keyframes cloud_outline_idle_stroke {
  0%   { --cloud_outline-stroke1: 1; }
  100% { --cloud_outline-stroke1: 1; }
}

/* --- composer rule for the cloud_outline path --- */
/* transform-origin anchored to the cloud's geometry (≈38% 46.5% of viewBox) */
.cloud_outline {
  transform-box: fill-box;
  transform-origin: 38% 46.5%;

  /* Compose visual state from lanes (kept neutral). Avoid putting transforms inside keyframes. */
  transform: translate(var(--cloud_outline-tx1, 0px), var(--cloud_outline-ty1, 0px))
             rotate(var(--cloud_outline-rot1, 0deg))
             scale(var(--cloud_outline-sx1, 1), var(--cloud_outline-sy1, 1));

  /* opacity + brightness for non-destructive visual adjustments */
  opacity: var(--cloud_outline-op1, 1);
  filter: brightness(var(--cloud_outline-bright1, 1)) blur(var(--cloud_outline-blur1, 0px));

  /* Use stroke-width driven by a lane — safe even if the shape is filled; keeps the lane available */
  /* Note: we do not overwrite fill; stroke-width declared to preserve lane semantics for future tweaks. */
  stroke-width: calc(var(--cloud_outline-stroke1, 1) * 1px);

  will-change: transform, opacity, filter, stroke-width;

  /* Start neutral animations immediately so they run in step with other animated elements.
     The index order across longhand animation-* lists aligns each lane to its keyframe. */
  animation-name: cloud_outline_idle_transform, cloud_outline_idle_opacity, cloud_outline_idle_brightness, cloud_outline_idle_blur, cloud_outline_idle_stroke;
  animation-duration: 3s, 2.8s, 3.2s, 4s, 5s;
  animation-timing-function: cubic-bezier(.4,0,.2,1), cubic-bezier(.4,0,.2,1), cubic-bezier(.4,0,.2,1), cubic-bezier(.4,0,.2,1), cubic-bezier(.4,0,.2,1);
  animation-delay: 0s, 0s, 0s, 0s, 0s;
  animation-iteration-count: infinite, infinite, infinite, infinite, infinite;
  animation-direction: normal, normal, normal, normal, normal;
  animation-fill-mode: both, both, both, both, both;
  animation-play-state: running, running, running, running, running;
}

/* Coherence note:
   - Lanes are intentionally neutral to avoid visual collisions with the lightning bolt and raindrops.
   - Animations are lightweight identity keyframes; they keep the timeline alive and in-phase with
     neighboring motions without impacting rendering complexity.
*/

/* Lightning bolt glow + subtle breath animation
   - Implements lanes pattern using custom properties (@property) so keyframes never write transform directly.
   - Animates glow opacity and blur plus a gentle scale "breath".
   - Uses drop-shadow as the outer glow so no markup changes required.
   - All animations start on load and loop indefinitely.
*/

/* --- declare @property lanes for lightning_bolt (added once) --- */
@property --lightning_bolt-tx1 { syntax: "<length>"; inherits: false; initial-value: 0px; }
@property --lightning_bolt-ty1 { syntax: "<length>"; inherits: false; initial-value: 0px; }
@property --lightning_bolt-rot1 { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
@property --lightning_bolt-sx1 { syntax: "<number>"; inherits: false; initial-value: 1; }
@property --lightning_bolt-sy1 { syntax: "<number>"; inherits: false; initial-value: 1; }
@property --lightning_bolt-op1 { syntax: "<number>"; inherits: false; initial-value: 1; }
@property --lightning_bolt-blur1 { syntax: "<length>"; inherits: false; initial-value: 0px; }
@property --lightning_bolt-stroke1 { syntax: "<number>"; inherits: false; initial-value: 1; }
@property --lightning_bolt-bright1 { syntax: "<number>"; inherits: false; initial-value: 1; }

/* lanes reserved for motion (breath + glow) - next free lanes (sx2/sy2 for scale; op2/blur2 for glow) */
@property --lightning_bolt-tx2 { syntax: "<length>"; inherits: false; initial-value: 0px; }
@property --lightning_bolt-ty2 { syntax: "<length>"; inherits: false; initial-value: 0px; }
@property --lightning_bolt-rot2 { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
@property --lightning_bolt-sx2 { syntax: "<number>"; inherits: false; initial-value: 1; }
@property --lightning_bolt-sy2 { syntax: "<number>"; inherits: false; initial-value: 1; }
@property --lightning_bolt-op2 { syntax: "<number>"; inherits: false; initial-value: 0.18; }
@property --lightning_bolt-blur2 { syntax: "<length>"; inherits: false; initial-value: 0.6px; }
@property --lightning_bolt-stroke2 { syntax: "<number>"; inherits: false; initial-value: 1; }
@property --lightning_bolt-bright2 { syntax: "<number>"; inherits: false; initial-value: 1; }

/* --- keyframes only change custom properties (no direct transform/filter values inside keyframes) --- */
/* Glow opacity lane (soft pulse) */
@keyframes lightning_bolt_glow_opacity {
  0%   { --lightning_bolt-op2: 0.18; }
  50%  { --lightning_bolt-op2: 0.85; }
  100% { --lightning_bolt-op2: 0.18; }
}

/* Glow blur lane (stdDeviation-like pulse; expressed in CSS length) */
@keyframes lightning_bolt_glow_blur {
  0%   { --lightning_bolt-blur2: 0.6px; }
  50%  { --lightning_bolt-blur2: 3.0px; }
  100% { --lightning_bolt-blur2: 0.6px; }
}

/* Breathing scale lane (very subtle) - uses sx2/sy2 lanes */
@keyframes lightning_bolt_breathe_scale {
  0%   { --lightning_bolt-sx2: 1;     --lightning_bolt-sy2: 1; }
  50%  { --lightning_bolt-sx2: 1.025; --lightning_bolt-sy2: 1.025; }
  100% { --lightning_bolt-sx2: 1;     --lightning_bolt-sy2: 1; }
}

/* --- composer rule for the lightning bolt path (added once) ---
   transform-origin chosen from data-center-relative ≈ (41.10, 21.20) on 64x64 viewBox:
   -> x% ≈ 41.10/64 ≈ 64.2% ; y% ≈ 21.20/64 ≈ 33.1%
   This anchors the breath to the bolt's center/base so it expands/contracts naturally.
*/
.lightning_bolt {
  transform-box: fill-box;
  transform-origin: 64.2% 33.1%;

  /* compose transform from lanes (scale uses sx2/sy2 breathing lane) */
  transform: translate(var(--lightning_bolt-tx1, 0px), var(--lightning_bolt-ty1, 0px))
             rotate(var(--lightning_bolt-rot1, 0deg))
             scale(var(--lightning_bolt-sx2, 1), var(--lightning_bolt-sy2, 1));

  /* main fill opacity + brightness lane (kept available) */
  opacity: var(--lightning_bolt-op1, 1);
  filter:
    /* outer glow using drop-shadow; color picked to match bolt fill (#ffce31).
       The blur radius and alpha are driven by lanes so they animate via keyframes. */
    drop-shadow(0 0 var(--lightning_bolt-blur2, 0.6px) rgba(255,206,49, var(--lightning_bolt-op2, 0.18)));

  will-change: transform, filter, opacity;

  /* Start the lanes together with the desired timing. Indexes aligned across longhand lists. */
  animation-name: lightning_bolt_glow_opacity, lightning_bolt_glow_blur, lightning_bolt_breathe_scale;
  animation-duration: 1.8s, 1.8s, 1.8s;
  animation-timing-function: ease-in-out, ease-in-out, cubic-bezier(.4,0,.2,1);
  animation-delay: 0s, 0s, 0s;
  animation-iteration-count: infinite, infinite, infinite;
  animation-direction: normal, normal, normal;
  animation-fill-mode: both, both, both;
  animation-play-state: running, running, running;
}

/* Coherence notes:
   - Lanes are self-contained and neutral with respect to other cloud animations; they only affect
     the lightning bolt and its glow so collisions with cloud/drops are avoided.
   - Using drop-shadow keeps markup unchanged and performs well on modern browsers. The animated
     values are small and loop quickly (1.8s) to feel lively but subtle.
   - Keyframes never write direct transforms; they only change custom properties read by the composer rule.
*/

/* left_top_drop animation lanes + composer
   - Adds lanes only for left_top_drop and composes transform/opacity from them.
   - Motion lanes (ty2, sx2/sy2, op2) carry the visible animation; keyframes modify only custom properties
     (no direct transform inside keyframes) to avoid collision with other element lanes.
   - Transform-origin derived from group's data-center-relative "7.50,24.90" on 64×64 viewBox:
     -> 7.50/64 ≈ 11.7% ; 24.90/64 ≈ 38.9%
*/

/* --- base lanes (declare once) --- */
@property --left_top_drop-tx1  { syntax: "<length>"; inherits: false; initial-value: 0px; }
@property --left_top_drop-ty1  { syntax: "<length>"; inherits: false; initial-value: 0px; }
@property --left_top_drop-rot1 { syntax: "<angle>";  inherits: false; initial-value: 0deg; }
@property --left_top_drop-sx1  { syntax: "<number>"; inherits: false; initial-value: 1; }
@property --left_top_drop-sy1  { syntax: "<number>"; inherits: false; initial-value: 1; }
@property --left_top_drop-op1  { syntax: "<number>"; inherits: false; initial-value: 1; }
@property --left_top_drop-blur1 { syntax: "<length>"; inherits: false; initial-value: 0px; }
@property --left_top_drop-stroke1 { syntax: "<number>"; inherits: false; initial-value: 1; }
@property --left_top_drop-bright1 { syntax: "<number>"; inherits: false; initial-value: 1; }

/* --- motion lanes (next free lanes) --- */
/* ty2: vertical fall; sx2/sy2: tiny scale; op2: fade in/out */
@property --left_top_drop-tx2  { syntax: "<length>"; inherits: false; initial-value: 0px; }
@property --left_top_drop-ty2  { syntax: "<length>"; inherits: false; initial-value: 0px; }
@property --left_top_drop-rot2 { syntax: "<angle>";  inherits: false; initial-value: 0deg; }
@property --left_top_drop-sx2  { syntax: "<number>"; inherits: false; initial-value: 1; }
@property --left_top_drop-sy2  { syntax: "<number>"; inherits: false; initial-value: 1; }
@property --left_top_drop-op2  { syntax: "<number>"; inherits: false; initial-value: 0; }
@property --left_top_drop-blur2 { syntax: "<length>"; inherits: false; initial-value: 0px; }
@property --left_top_drop-stroke2 { syntax: "<number>"; inherits: false; initial-value: 1; }
@property --left_top_drop-bright2 { syntax: "<number>"; inherits: false; initial-value: 1; }

/* --- keyframes: only mutate custom properties (no direct transform) --- */
/* Opacity: 0 -> 1 -> 0 */
@keyframes left_top_drop_fade_opacity {
  0%   { --left_top_drop-op2: 0; }
  50%  { --left_top_drop-op2: 1; }
  100% { --left_top_drop-op2: 0; }
}

/* Vertical motion: small fall and rebound (0px -> 6px -> 0px) */
@keyframes left_top_drop_fall_translate {
  0%   { --left_top_drop-ty2: 0px; }
  50%  { --left_top_drop-ty2: 6px; }
  100% { --left_top_drop-ty2: 0px; }
}

/* Subtle scale (0.99 -> 1.01 -> 0.99) to avoid mechanical motion */
@keyframes left_top_drop_breath_scale {
  0%   { --left_top_drop-sx2: 0.99; --left_top_drop-sy2: 0.99; }
  50%  { --left_top_drop-sx2: 1.01; --left_top_drop-sy2: 1.01; }
  100% { --left_top_drop-sx2: 0.99; --left_top_drop-sy2: 0.99; }
}

/* --- composer rule for the SVG path with class left_top_drop --- */
.left_top_drop {
  /* keep transforms relative to the shape geometry */
  transform-box: fill-box;
  transform-origin: 11.7% 38.9%;

  /* Compose the final transform from lanes:
     - ty2 drives the visible vertical fall
     - sx2/sy2 drive the tiny scale breathing
     - tx1/rot1/sx1 etc remain available for future lanes (kept in order) */
  transform:
    translate(var(--left_top_drop-tx1, 0px), var(--left_top_drop-ty2, 0px))
    rotate(var(--left_top_drop-rot1, 0deg))
    scale(var(--left_top_drop-sx2, 1), var(--left_top_drop-sy2, 1));

  /* Opacity controlled by the motion lane op2 (falls in sync with movement).
     Fall back to op1 if op2 is not present for robust composition. */
  opacity: var(--left_top_drop-op2, var(--left_top_drop-op1, 1));

  will-change: transform, opacity;

  /* Start the three lanes together. Use longhand animation lists with aligned indexes. */
  animation-name: left_top_drop_fade_opacity, left_top_drop_fall_translate, left_top_drop_breath_scale;
  animation-duration: 1.25s, 1.25s, 1.25s;
  animation-timing-function: cubic-bezier(.4,0,.2,1), cubic-bezier(.4,0,.2,1), cubic-bezier(.4,0,.2,1);
  animation-delay: 0.05s, 0.05s, 0.05s;              /* small stagger to sit in rhythm with other drops */
  animation-iteration-count: infinite, infinite, infinite;
  animation-direction: normal, normal, normal;
  animation-fill-mode: both, both, both;
  animation-play-state: running, running, running;
}

/* Coherence notes:
   - This drop's motion is intentionally subtle and phase-aligned (same delay on all lanes) so it
     reads as a soft fall that does not visually collide with the cloud or lightning. The transform-origin
     anchors the motion to the SVG group's data-center-relative coordinates to avoid clipping or odd pivots.
   - Keyframes only change custom properties (lanes) to avoid interfering with other element animations
     and to keep the compositor-friendly pattern already used across the SVG.
   - Performance: animations are small (translate + opacity + tiny scale) and use will-change to hint
     GPU-friendly properties; they will be inexpensive even with multiple drops animated.
*/

/* left_mid_drop - staggered fade + vertical drift with tiny horizontal wobble
   - Lanes pattern: custom properties declared once; keyframes only mutate custom properties
     (no direct transform inside @keyframes) to avoid collisions with other animated elements.
   - Transform-origin derived from group data-center-relative "21.20,31.40" on 64×64 viewBox:
     -> x% = 21.20/64 ≈ 33.1% ; y% = 31.40/64 ≈ 49.1%
   - Motion uses the next free lanes (tx2, ty2, op2). Duration 1.35s, delay 0.30s, ease-in-out, infinite.
   - Slightly different amplitude than siblings (7px fall, ±1px wobble) so each drop reads as an individual.
*/

/* --- @property lanes (added once for left_mid_drop) --- */
@property --left_mid_drop-tx1  { syntax: "<length>"; inherits: false; initial-value: 0px; }
@property --left_mid_drop-ty1  { syntax: "<length>"; inherits: false; initial-value: 0px; }
@property --left_mid_drop-rot1 { syntax: "<angle>";  inherits: false; initial-value: 0deg; }
@property --left_mid_drop-sx1  { syntax: "<number>"; inherits: false; initial-value: 1; }
@property --left_mid_drop-sy1  { syntax: "<number>"; inherits: false; initial-value: 1; }
@property --left_mid_drop-op1  { syntax: "<number>"; inherits: false; initial-value: 1; }
@property --left_mid_drop-blur1 { syntax: "<length>"; inherits: false; initial-value: 0px; }
@property --left_mid_drop-stroke1 { syntax: "<number>"; inherits: false; initial-value: 1; }
@property --left_mid_drop-bright1 { syntax: "<number>"; inherits: false; initial-value: 1; }

/* --- motion lanes (next free lanes) --- */
/* ty2: vertical fall; tx2: tiny horizontal wobble; op2: fade in/out */
@property --left_mid_drop-tx2  { syntax: "<length>"; inherits: false; initial-value: 0px; }
@property --left_mid_drop-ty2  { syntax: "<length>"; inherits: false; initial-value: 0px; }
@property --left_mid_drop-rot2 { syntax: "<angle>";  inherits: false; initial-value: 0deg; }
@property --left_mid_drop-sx2  { syntax: "<number>"; inherits: false; initial-value: 1; }
@property --left_mid_drop-sy2  { syntax: "<number>"; inherits: false; initial-value: 1; }
@property --left_mid_drop-op2  { syntax: "<number>"; inherits: false; initial-value: 0; }
@property --left_mid_drop-blur2 { syntax: "<length>"; inherits: false; initial-value: 0px; }
@property --left_mid_drop-stroke2 { syntax: "<number>"; inherits: false; initial-value: 1; }
@property --left_mid_drop-bright2 { syntax: "<number>"; inherits: false; initial-value: 1; }

/* --- keyframes (only mutate custom properties) --- */
/* Fade: 0 -> 0.92 -> 0 */
@keyframes left_mid_drop_fade_opacity_v1 {
  0%   { --left_mid_drop-op2: 0; }
  50%  { --left_mid_drop-op2: 0.92; }
  100% { --left_mid_drop-op2: 0; }
}

/* Vertical fall: 0px -> 7px -> 0px (slightly larger amplitude than some siblings) */
@keyframes left_mid_drop_fall_translate_v1 {
  0%   { --left_mid_drop-ty2: 0px; }
  50%  { --left_mid_drop-ty2: 7px; }
  100% { --left_mid_drop-ty2: 0px; }
}

/* Tiny horizontal wobble centered at the peak (sub-pixel friendly values) */
@keyframes left_mid_drop_wobble_translate_v1 {
  0%   { --left_mid_drop-tx2: 0px; }
  25%  { --left_mid_drop-tx2: -0.6px; }
  50%  { --left_mid_drop-tx2: 1px; }
  75%  { --left_mid_drop-tx2: -0.6px; }
  100% { --left_mid_drop-tx2: 0px; }
}

/* --- composer rule for .left_mid_drop (added once) ---
   - Compose final transform from lanes; visible motion driven by tx2/ty2/op2.
   - Opacity reads op2 and falls back to op1 for robustness.
*/
.left_mid_drop {
  transform-box: fill-box;
  transform-origin: 33.1% 49.1%;

  /* Compose transform from lanes (motion resides on tx2/ty2) */
  transform:
    translate(var(--left_mid_drop-tx2, 0px), var(--left_mid_drop-ty2, 0px))
    rotate(var(--left_mid_drop-rot1, 0deg))
    scale(var(--left_mid_drop-sx1, 1), var(--left_mid_drop-sy1, 1));

  /* Opacity driven by motion lane op2; fallback to op1 for safety */
  opacity: var(--left_mid_drop-op2, var(--left_mid_drop-op1, 1));

  will-change: transform, opacity;

  /* Start all motion lanes together; indexes aligned across longhand lists */
