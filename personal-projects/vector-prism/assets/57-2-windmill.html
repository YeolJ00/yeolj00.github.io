<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   SVG Animation
  </title>
  <style>
   /* Add once: custom properties used as "lanes" for the foreground_hills entrance motion.
   We declare only the properties we need for this entrance (vertical translate, uniform scale, opacity).
   Using @property allows smooth, GPU-friendly interpolation of these values and avoids writing 'transform'
   inside keyframes (collision-avoidance rule).
*/
@property --foreground_hills-ty1 {
  syntax: '<length>';
  inherits: true;
  initial-value: 0px;
}
@property --foreground_hills-sx1 {
  syntax: '<number>';
  inherits: true;
  initial-value: 1;
}
@property --foreground_hills-sy1 {
  syntax: '<number>';
  inherits: true;
  initial-value: 1;
}
@property --foreground_hills-op1 {
  syntax: '<number>';
  inherits: true;
  initial-value: 1;
}

/* Composer rule for the foreground hills.
   - transform-box: fill-box keeps the transform origin in SVG coordinates.
   - transform-origin chosen so the hills appear to rise from the bottom region of the SVG.
   - Will-change helps the browser optimize compositing for the one-shot entrance.
*/
.foreground_hills {
  /* Place new motion in the next free lanes: ty1 (vertical), sx1/sy1 (scale), op1 (opacity). */
  --foreground_hills-ty1: 30px;   /* initial fallback: start slightly below */
  --foreground_hills-sx1: 0.98;   /* slight initial shrink */
  --foreground_hills-sy1: 0.98;
  --foreground_hills-op1: 0;

  transform-box: fill-box;
  transform-origin: 50% 85%; /* centre horizontally; origin near lower area of the hills */
  /* Compose final transform from lanes - do NOT place transform inside keyframes. */
  transform: translateY(var(--foreground_hills-ty1, 0px)) scale(var(--foreground_hills-sx1, 1), var(--foreground_hills-sy1, 1));
  opacity: var(--foreground_hills-op1, 1);

  /* Motion is one-shot entrance; use longhand animation properties for clarity and alignment with other lanes. */
  animation-name: fg-hills-entrance;
  animation-duration: 700ms;
  animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); /* easeOutBack-like */
  animation-delay: 0s; /* first element */
  animation-iteration-count: 1;
  animation-fill-mode: both; /* keep final state after animation completes */
  animation-play-state: running;

  will-change: transform, opacity;
  /* subtle hint: keep pointer-events as default so SVG interactivity isn't affected by the entrance */
}

/* Keyframes update only the custom properties (the "lanes").
   We avoid writing transform here to obey collision-avoidance rules and keep the animation composable
   with other potential lanes on the same element.
   The timing includes an overshoot for a soft bounce (60% overshoot, then settle).
*/
@keyframes fg-hills-entrance {
  0% {
    /* start: slightly below, small scale, hidden */
    --foreground_hills-ty1: 30px;
    --foreground_hills-sx1: 0.98;
    --foreground_hills-sy1: 0.98;
    --foreground_hills-op1: 0;
  }

  60% {
    /* overshoot: a little higher than final position and slightly larger scale for a soft "pop" */
    --foreground_hills-ty1: -6px;
    --foreground_hills-sx1: 1.02;
    --foreground_hills-sy1: 1.02;
    --foreground_hills-op1: 1;
  }

  80% {
    /* settle back toward final size/position */
    --foreground_hills-ty1: 2px;
    --foreground_hills-sx1: 0.995;
    --foreground_hills-sy1: 0.995;
    --foreground_hills-op1: 1;
  }

  100% {
    /* final: exactly aligned with scene, fully visible */
    --foreground_hills-ty1: 0px;
    --foreground_hills-sx1: 1;
    --foreground_hills-sy1: 1;
    --foreground_hills-op1: 1;
  }
}

/* Notes:
   - This entrance is intentionally subtle and only affects vertical translate, uniform scale and opacity.
   - transform-box + transform-origin chosen to avoid visual collision with midground elements (windmill, trees).
   - Using CSS custom properties as lanes makes this animation composable with other animations that may
     animate different lanes (rotation, brightness, blur, etc.) without stepping on their transforms.
   - The animation is one-shot and runs immediately on page load; no runtime classes required.
*/

/* Add once: custom property "lanes" for the path entrance.
   These allow GPU-friendly interpolation and keep transforms out of keyframes (collision-avoidance).
*/
@property --path-ty1 {
  syntax: '<length>';
  inherits: true;
  initial-value: 0px;
}
@property --path-sx1 {
  syntax: '<number>';
  inherits: true;
  initial-value: 1;
}
@property --path-sy1 {
  syntax: '<number>';
  inherits: true;
  initial-value: 1;
}
@property --path-op1 {
  syntax: '<number>';
  inherits: true;
  initial-value: 1;
}

/* Composer rule for .path elements.
   - Uses next free lanes (ty1, sx1/sy1, op1).
   - transform-box: fill-box so transform-origin is in SVG coordinates.
   - transform-origin chosen to read as the path rising from the lower/horizon area of the scene
     and to avoid visual collision with foreground_hills which use 50% 85%.
*/
.path {
  /* initial lane values (start slightly below, a hair narrower horizontally, hidden) */
  --path-ty1: 24px;
  --path-sx1: 0.99; /* subtle horizontal squash -> expands to 1 */
  --path-sy1: 1;    /* keep vertical scale unchanged */
  --path-op1: 0;

  transform-box: fill-box;
  /* path pieces sit slightly left-of-center on the lower foreground; origin slightly lower than hills
     so they appear to rise from the ground without clipping. */
  transform-origin: 47% 92%;
  transform: translateY(var(--path-ty1, 0px)) scale(var(--path-sx1, 1), var(--path-sy1, 1));
  opacity: var(--path-op1, 1);

  /* one-shot entrance timed to follow foreground_hills */
  animation-name: path-entrance;
  animation-duration: 650ms;
  animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); /* matches foreground easing for coherence */
  animation-delay: 80ms; /* 80ms after foreground_hills start to read as next depth layer */
  animation-iteration-count: 1;
  animation-fill-mode: both;
  animation-play-state: running;

  will-change: transform, opacity;
}

/* Keyframes update only the custom properties (lanes).
   No 'transform' written here to avoid collisions with other motion lanes.
   Gentle overshoot gives a soft settling that matches the foreground hill entrance visually.
*/
@keyframes path-entrance {
  0% {
    --path-ty1: 24px;
    --path-sx1: 0.99;
    --path-sy1: 1;
    --path-op1: 0;
  }

  60% {
    /* slight overshoot upward and subtle horizontal expansion for a soft "pop" */
    --path-ty1: -4px;
    --path-sx1: 1.02;
    --path-sy1: 1;
    --path-op1: 1;
  }

  80% {
    /* settle back toward final size/position */
    --path-ty1: 2px;
    --path-sx1: 0.995;
    --path-sy1: 1;
    --path-op1: 1;
  }

  100% {
    --path-ty1: 0px;
    --path-sx1: 1;
    --path-sy1: 1;
    --path-op1: 1;
  }
}

/* Notes:
   - This animation is intentionally subtle and compact to match the foreground_hills entrance but read
     as the next layer of depth. The 80ms delay ensures the hills lead and the path follows.
   - Using custom-property lanes keeps this motion composable with other transform lanes (rotation, blur, etc.)
     and avoids stepping on any existing transforms elsewhere in the SVG.
   - All animation longhands are used to make timing explicit; animation runs immediately on load (no runtime classes).
*/

/* Add once: custom-property lanes for midground_hills entrance.
   These allow GPU-friendly interpolation and keep 'transform' out of keyframes
   (collision-avoidance with other transform lanes).
*/
@property --midground_hills-ty1 {
  syntax: '<length>';
  inherits: true;
  initial-value: 0px;
}
@property --midground_hills-sx1 {
  syntax: '<number>';
  inherits: true;
  initial-value: 1;
}
@property --midground_hills-sy1 {
  syntax: '<number>';
  inherits: true;
  initial-value: 1;
}
@property --midground_hills-op1 {
  syntax: '<number>';
  inherits: true;
  initial-value: 1;
}

/* Composer rule for midground_hills.
   - Uses next free lanes: ty1 (vertical), sx1/sy1 (scale), op1 (opacity).
   - transform-box: fill-box so origin is in SVG coordinates.
   - transform-origin chosen so the midground hills appear to rise from the horizon
     just above the foreground hills and avoid collision with the windmill blades.
   - The transform itself is composed from the lanes (no 'transform' inside keyframes).
*/
.midground_hills {
  /* entrance initial lane values (start slightly lower, vertically flattened, hidden) */
  --midground_hills-ty1: 20px;
  --midground_hills-sx1: 0.998; /* tiny horizontal compensation so pop looks natural */
  --midground_hills-sy1: 0.95;  /* flattened vertically -> will grow to 1 */
  --midground_hills-op1: 0;

  transform-box: fill-box;
  transform-origin: 50% 80%; /* center horizontally; origin slightly higher than foreground hills */
  transform: translateY(var(--midground_hills-ty1, 0px)) scale(var(--midground_hills-sx1, 1), var(--midground_hills-sy1, 1));
  opacity: var(--midground_hills-op1, 1);

  /* One-shot entrance that follows foreground_hills/path for layered depth.
     Duration/easing chosen per design: lively pop with small elastic settle. */
  animation-name: midground-hills-entrance;
  animation-duration: 600ms;
  animation-timing-function: cubic-bezier(0.2, 0.85, 0.25, 1);
  animation-delay: 180ms; /* intentionally after foreground (which starts at 0ms) and path (80ms) */
  animation-iteration-count: 1;
  animation-fill-mode: both;
  animation-play-state: running;

  will-change: transform, opacity;
}

/* Keyframes update only the custom properties (lanes) to avoid stepping on other transform lanes.
   Gentle overshoot at ~60% then a subtle settle to final state for an elastic feel.
*/
@keyframes midground-hills-entrance {
  0% {
    --midground_hills-ty1: 20px;
    --midground_hills-sx1: 0.998;
    --midground_hills-sy1: 0.95;
    --midground_hills-op1: 0;
  }

  60% {
    /* slight overshoot up and slight expansion for a soft "pop" */
    --midground_hills-ty1: -6px;
    --midground_hills-sx1: 1.004;
    --midground_hills-sy1: 1.03;
    --midground_hills-op1: 1;
  }

  80% {
    /* settle back toward final size/position (small undershoot) */
    --midground_hills-ty1: 2px;
    --midground_hills-sx1: 0.999;
    --midground_hills-sy1: 0.995;
    --midground_hills-op1: 1;
  }

  100% {
    /* final: aligned with scene, fully visible */
    --midground_hills-ty1: 0px;
    --midground_hills-sx1: 1;
    --midground_hills-sy1: 1;
    --midground_hills-op1: 1;
  }
}

/* Notes:
   - The 180ms delay keeps midground after the foreground_hills (0ms) and path (80ms) so depth reads correctly.
   - Using custom-property "lanes" keeps this motion composable with other lanes (rotation, blur, etc.)
     and avoids transform collisions.
   - The animation is one-shot and runs immediately on page load (no runtime classes required).
   - Kept changes minimal and GPU-friendly (transforms & opacity only).
*/

/* Background hills: subtle slide+fade entrance that anchors the distant horizon.
   - Uses its own lanes to avoid stepping on other transform lanes.
   - Timing chosen to sit after foreground/path/midground entrances (260ms delay).
   - transform-box + transform-origin chosen so the band rises from the scene horizon
     (keeps motion visually aligned with other hill layers).
*/

/* Add once: custom-property lanes for background_hills (length + opacity). */
@property --background_hills-ty1 {
  syntax: '<length>';
  inherits: true;
  initial-value: 0px;
}
@property --background_hills-op1 {
  syntax: '<number>';
  inherits: true;
  initial-value: 1;
}

/* Composer rule for the background_hills elements (next free lanes: ty1, op1). */
.background_hills {
  /* start slightly below the horizon and invisible */
  --background_hills-ty1: 14px;
  --background_hills-op1: 0;

  transform-box: fill-box;
  /* origin placed near the horizon area of the SVG so the band appears to settle into place
     without colliding with mid/foreground elements (midground used ~80%/85% previously). */
  transform-origin: 50% 72%;
  transform: translateY(var(--background_hills-ty1, 0px));
  opacity: var(--background_hills-op1, 1);

  /* One-shot entrance coordinated with other layer animations */
  animation-name: background-hills-entrance;
  animation-duration: 500ms;
  animation-timing-function: ease-out;
  animation-delay: 260ms; /* follows foreground (0ms), path (80ms), midground (180ms) */
  animation-iteration-count: 1;
  animation-fill-mode: both;
  animation-play-state: running;

  will-change: transform, opacity;
}

/* Keyframes only update the custom-property "lanes" (no 'transform' inside keyframes). */
@keyframes background-hills-entrance {
  0% {
    --background_hills-ty1: 14px;
    --background_hills-op1: 0;
  }

  100% {
    --background_hills-ty1: 0px;
    --background_hills-op1: 1;
  }
}

/* Brief note:
   - This is intentionally restrained to avoid drawing attention from foreground motion (windmill, trees).
   - Using only GPU-friendly transforms and opacity keeps this performant even inside complex SVG scenes.
*/

/* LEFT TREE animation lanes (added once).
   - Lanes follow the project's naming convention and avoid writing 'transform' inside keyframes.
   - We declare only the lanes we need: vertical translate for trunk (ty1),
     uniform scale & opacity for foliage (sx1/sy1/op1), and a small rotation lane (rot1)
     for the gentle wobble applied to the whole tree.
*/
@property --left_tree-ty1 {
  syntax: '<length>';
  inherits: true;
  initial-value: 0px;
}
@property --left_tree-sx1 {
  syntax: '<number>';
  inherits: true;
  initial-value: 1;
}
@property --left_tree-sy1 {
  syntax: '<number>';
  inherits: true;
  initial-value: 1;
}
@property --left_tree-op1 {
  syntax: '<number>';
  inherits: true;
  initial-value: 1;
}
@property --left_tree-rot1 {
  syntax: '<angle>';
  inherits: true;
  initial-value: 0deg;
}

/* Composer for individual left_tree paths.
   - transform is composed from lanes so keyframes never write 'transform' directly.
   - transform-box: fill-box keeps SVG coordinates consistent with the rest of the file.
   - transform-origin chosen near the trunk base so scaling/pivoting and the small rotation
     feel anchored to the tree root and avoid visual collision with nearby hills.
   - By default this rule provides the wobble animation (runs after entrance finishes).
     Entrance animations are added per-element (trunk vs foliage) below so lane updates
     don't collide between different visual parts.
*/
.left_tree {
  /* default lane values (sensible defaults for any left_tree piece) */
  --left_tree-ty1: 0px;
  --left_tree-sx1: 1;
  --left_tree-sy1: 1;
  --left_tree-op1: 1;
  --left_tree-rot1: 0deg;

  transform-box: fill-box;
  transform-origin: 50% 92%;
  transform: translateY(var(--left_tree-ty1, 0px))
             rotate(var(--left_tree-rot1, 0deg))
             scale(var(--left_tree-sx1, 1), var(--left_tree-sy1, 1));
  opacity: var(--left_tree-op1, 1);

  /* wobble (single-shot) — default timings place it after the entrance (see overrides below).
     If an element doesn't override animations, it will still get the wobble but no entrance.
     Using longhand lists would be required if we placed multiple animations here; for clarity
     we apply only wobble here and add the entrance animation explicitly for trunk/foliage. */
  animation-name: left-tree-wobble;
  animation-duration: 700ms;
  animation-timing-function: ease-in-out;
  /* delay chosen so wobble will begin after the entrance in most cases:
     entrance delay 340ms + entrance duration 520ms = 860ms (matches overrides below). */
  animation-delay: 860ms;
  animation-iteration-count: 1;
  animation-fill-mode: both;
  animation-play-state: running;

  will-change: transform, opacity;
}

/* TRUNK: target the brown trunk path by its fill color to be robust across group variants.
   - Entrance: trunk slides up (18px → 0) and fades in.
   - We provide a two-entry animation list: [trunk-entrance, wobble] — aligned indexes are required.
   - Duration / delay chosen to match the plan and to layer with the existing scene animations:
     entrance duration 520ms, easing matches other pop animations for cohesion.
*/
.left_tree[fill="#674447"] {
  /* trunk starts slightly below and hidden */
  --left_tree-ty1: 18px;
  --left_tree-op1: 0;
  --left_tree-sx1: 1;
  --left_tree-sy1: 1;
  --left_tree-rot1: 0deg;

  /* two animations: trunk entrance (index 0) and the shared wobble (index 1) */
  animation-name: left-tree-trunk-entrance, left-tree-wobble;
  animation-duration: 520ms, 700ms;
  animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1), ease-in-out;
  animation-delay: 340ms, 860ms; /* entrance starts at 340ms, wobble starts after entrance */
  animation-iteration-count: 1, 1;
  animation-fill-mode: both, both;
  animation-play-state: running, running;
}

/* FOLIAGE: target non-trunk left_tree pieces (the green shapes).
   - Entrance: pop-up scale from 0.7 → 1.05 → 1 and fade in (opacity 0 → 1).
   - We provide a two-entry animation list (foliage-entrance, wobble) aligned with the trunk rule above.
*/
.left_tree:not([fill="#674447"]) {
  /* foliage starts scaled down and hidden; no vertical offset for foliage layer */
  --left_tree-ty1: 0px;
  --left_tree-sx1: 0.7;
  --left_tree-sy1: 0.7;
  --left_tree-op1: 0;
  --left_tree-rot1: 0deg;

  /* two animations: foliage entrance (index 0) and the shared wobble (index 1) */
  animation-name: left-tree-foliage-entrance, left-tree-wobble;
  animation-duration: 520ms, 700ms;
  animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1), ease-in-out;
  animation-delay: 340ms, 860ms; /* entrance leads; wobble follows */
  animation-iteration-count: 1, 1;
  animation-fill-mode: both, both;
  animation-play-state: running, running;
}

/* Keyframes for the trunk entrance. Only updates the trunk lanes (ty1, op1).
   - Small overshoot upwards then gentle settle to match other hill/tree pops visually.
*/
@keyframes left-tree-trunk-entrance {
  0% {
    --left_tree-ty1: 18px;
    --left_tree-op1: 0;
  }
  60% {
    --left_tree-ty1: -4px;
    --left_tree-op1: 1;
  }
  80% {
    --left_tree-ty1: 2px;
  }
  100% {
    --left_tree-ty1: 0px;
    --left_tree-op1: 1;
  }
}

/* Keyframes for the foliage entrance. Only updates foliage lanes (sx1, sy1, op1).
   - Subtle overshoot scale to 1.05 and then settle to 1 for a pleasant pop.
*/
@keyframes left-tree-foliage-entrance {
  0% {
    --left_tree-sx1: 0.7;
    --left_tree-sy1: 0.7;
    --left_tree-op1: 0;
  }
  60% {
    --left_tree-sx1: 1.05;
    --left_tree-sy1: 1.05;
    --left_tree-op1: 1;
  }
  80% {
    --left_tree-sx1: 0.995;
    --left_tree-sy1: 0.995;
  }
  100% {
    --left_tree-sx1: 1;
    --left_tree-sy1: 1;
    --left_tree-op1: 1;
  }
}

/* Gentle wobble applied to the whole tree via the rotation lane.
   - Runs once after the entrance completes (700ms) and returns to neutral.
   - Small ±3° gives an organic feel without causing noticeable clipping or collision.
*/
@keyframes left-tree-wobble {
  0% {
    --left_tree-rot1: 0deg;
  }
  20% {
    --left_tree-rot1: -3deg;
  }
  60% {
    --left_tree-rot1: 3deg;
  }
  100% {
    --left_tree-rot1: 0deg;
  }
}

/* Notes:
   - All transforms/opacity changes use GPU-friendly properties (translate, rotate, scale, opacity).
   - Keyframes only update custom properties (lanes) — this avoids transform collisions with other animations.
   - Delays (340ms entrance delay) and durations (520ms entrance) are chosen to align with the scene's
     timing (foreground/midground/background hierarchies) so the left tree reads as a secondary foreground element.
   - The trunk selector uses the trunk's fill attribute to avoid accidentally applying trunk-specific motion
     to single-path left_tree variants; foliage selector targets remaining left_tree pieces.
*/

/* center_tree: add lanes (once) and composer + keyframes.
   - Uses its own lanes to avoid colliding with existing lanes (left_tree, mid/foreground, etc.).
   - Entrance: subtle pop similar to left_tree but slightly larger and a touch later (420ms) to read depth.
   - Wobble: small ±3° single-shot after the pop completes (entrance end = 420ms + 540ms = 960ms).
   - Keyframes only update custom properties (lanes) — never write 'transform' inside @keyframes.
*/

/* Add-on @property lanes for center_tree (declared once). */
@property --center_tree-ty1 {
  syntax: '<length>';
  inherits: true;
  initial-value: 0px;
}
@property --center_tree-sx1 {
  syntax: '<number>';
  inherits: true;
  initial-value: 1;
}
@property --center_tree-sy1 {
  syntax: '<number>';
  inherits: true;
  initial-value: 1;
}
@property --center_tree-op1 {
  syntax: '<number>';
  inherits: true;
  initial-value: 1;
}
@property --center_tree-rot1 {
  syntax: '<angle>';
  inherits: true;
  initial-value: 0deg;
}

/* Composer rule for .center_tree
   - transform-box: fill-box so transform-origin is in SVG coordinates.
   - transform-origin chosen to anchor the tree at its base (consistent with left_tree origin),
     avoiding collisions with foreground hills and the windmill.
   - The transform is composed from the lanes; keyframes only update lanes.
*/
.center_tree {
  /* Entrance starting lanes: start slightly below (20px), scaled down (0.75) and invisible. */
  --center_tree-ty1: 20px;
  --center_tree-sx1: 0.75;
  --center_tree-sy1: 0.75;
  --center_tree-op1: 0;
  --center_tree-rot1: 0deg;

  transform-box: fill-box;
  /* Center tree sits roughly mid-horizon; anchor a little above the very bottom so scale feels natural. */
  transform-origin: 50% 90%;
  transform: translateY(var(--center_tree-ty1, 0px))
             rotate(var(--center_tree-rot1, 0deg))
             scale(var(--center_tree-sx1, 1), var(--center_tree-sy1, 1));
  opacity: var(--center_tree-op1, 1);

  /* Two aligned animations:
     - index 0: entrance pop
     - index 1: gentle wobble that runs after entrance completes
     Use longhand lists so timing is explicit & aligned with the existing animation style.
  */
  animation-name: center-tree-entrance, center-tree-wobble;
  animation-duration: 540ms, 700ms;
  animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1), ease-in-out;
  animation-delay: 420ms, 960ms; /* entrance starts at 420ms; wobble starts when entrance ends (420+540=960) */
  animation-iteration-count: 1, 1;
  animation-fill-mode: both, both;
  animation-play-state: running, running;

  will-change: transform, opacity;
}

/* Entrance keyframes: update only the lanes (ty1/sx1/sy1/op1).
   - Subtle overshoot to 1.05 at 60%, then settle to 1 by 100% for a pleasant pop.
*/
@keyframes center-tree-entrance {
  0% {
    --center_tree-ty1: 20px;
    --center_tree-sx1: 0.75;
    --center_tree-sy1: 0.75;
    --center_tree-op1: 0;
  }

  60% {
    --center_tree-ty1: -6px;       /* small overshoot upward */
    --center_tree-sx1: 1.05;       /* slight overshoot scale for pop */
    --center_tree-sy1: 1.05;
    --center_tree-op1: 1;
  }

  80% {
    --center_tree-ty1: 2px;        /* gentle settle */
    --center_tree-sx1: 0.995;
    --center_tree-sy1: 0.995;
    --center_tree-op1: 1;
  }

  100% {
    --center_tree-ty1: 0px;
    --center_tree-sx1: 1;
    --center_tree-sy1: 1;
    --center_tree-op1: 1;
  }
}

/* Wobble keyframes: update only the rotation lane.
   - Small ±3° single-shot wobble that returns to neutral.
   - Runs once after entrance completes (see animation-delay above).
*/
@keyframes center-tree-wobble {
  0% {

/* Composer rule for individual right_tree pieces ----------------------------------------------
   - transform-box: fill-box keeps transforms in SVG coordinates.
   - transform-origin anchored near the trunk base so pop/wobble feel rooted (consistent with other trees).
   - Transform is composed from the lanes; keyframes must not write 'transform'.
   - Default applies the gentle wobble; entrance animations are added per-element below.
*/
.right_tree {
  --right_tree-tx1: 0px;
  --right_tree-ty1: 0px;
  --right_tree-sx1: 1;
  --right_tree-sy1: 1;
  --right_tree-op1: 1;

  transform-origin: 50% 92%;
  transform: translateX(var(--right_tree-tx1, 0px))
             translateY(var(--right_tree-ty1, 0px))
             rotate(var(--right_tree-rot1, 0deg))
             scale(var(--right_tree-sx1, 1), var(--right_tree-sy1, 1));
  opacity: var(--right_tree-op1, 1);

  /* Gentle wobble by default (runs after entrances) so elements that don't override still get life. */
  animation-name: right-tree-wobble;
  animation-duration: 700ms;
  animation-timing-function: ease-in-out;
  animation-delay: 1000ms; /* will be overridden where needed; set so standalone pieces still wobble later */
  animation-iteration-count: 1;
  animation-fill-mode: both;
  animation-play-state: running;

  will-change: transform, opacity;
}

   - Delay: 480ms so it follows main foreground/midground entrances.

/* Composer rule for the windmill base.
   - transform-box: fill-box keeps the origin in SVG coordinates.
   - transform-origin anchored near the base bottom so the piece appears to rise from the hill.
   - The transform is composed from the lanes to avoid collisions with other transform lanes.

  transform-origin: 50% 88%;

  opacity: var(--windmill_base-op1, 1);

/* Keyframes update only custom properties (lanes) — never write 'transform' here.

/* Windmill tower entrance + subtle settle — follows the project's "lanes" pattern.
   - Adds lanes once for tower motion and a composer rule that composes transform from lanes.
   - Entrance: erects from the base with a pop-and-stretch (translateY + scaleY + opacity).
   - Subtle rotation wobble (±1.5°) runs in parallel and is timed to feel synced with the elastic pop.
   - Timing chosen to sit after other scene entrances (820ms delay) and to match designer easing for cohesion.
   - Keyframes ONLY update custom properties (lanes) — no 'transform' inside @keyframes to avoid collision.
*/

/* Declare lanes ONCE (length/number/angle as appropriate). */
@property --windmill_tower-ty1 {

  initial-value: 0px;
}
@property --windmill_tower-sx1 {
  syntax: '<number>';
  inherits: true;
  initial-value: 1;
}
@property --windmill_tower-sy1 {
  syntax: '<number>';
  inherits: true;
  initial-value: 1;

@property --windmill_tower-op1 {

/* Composer for the windmill tower — composes transform from lanes.
   - transform-box: fill-box keeps origin in SVG coords.
   - transform-origin bottom-center (anchored to the base so tower appears to rise from the base).
   - The transform is constructed here; keyframes only change lanes.
*/
.windmill_tower {
  /* initial lane values (start offset down, compressed vertically, hidden) */
  --windmill_tower-ty1: 36px;  /* start below the final position */
  --windmill_tower-sx1: 1;     /* keep horizontal scale steady */
  --windmill_tower-sy1: 0.6;   /* stretched/compressed vertically at start for momentum */
  --windmill_tower-op1: 0;
  --windmill_tower-rot1: 0deg;

  transform-box: fill-box;
  /* anchor to the bottom-center of the tower group so it appears to spring from the base.
     88% chosen to keep the pivot near the element's foot and aligned with windmill_base origin. */
  transform-origin: 50% 88%;
  transform: translateY(var(--windmill_tower-ty1, 0px))
             rotate(var(--windmill_tower-rot1, 0deg))
             scale(var(--windmill_tower-sx1, 1), var(--windmill_tower-sy1, 1));
  opacity: var(--windmill_tower-op1, 1);

  /* Two aligned animations:
     - index 0: entrance (translateY + scaleY + opacity)
     - index 1: subtle rotation settle (±1.5°) timed to match the entrance bounce
     Using longhand lists to make timings explicit & aligned with other scene animations.
  */
  animation-name: windmill-tower-entrance, windmill-tower-rot-settle;
  animation-duration: 520ms, 520ms;
  animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1), cubic-bezier(0.22, 1, 0.36, 1);
  animation-delay: 820ms, 820ms; /* entrance starts at 820ms; rotation runs in parallel to feel synced */
  animation-iteration-count: 1, 1;
  animation-fill-mode: both, both;
  animation-play-state: running, running;

  will-change: transform, opacity;
}

/* Entrance keyframes: update only translateY, scaleY and opacity lanes.

    --windmill_tower-sy1: 0.6;
    --windmill_tower-op1: 0;

    --windmill_tower-ty1: 2px;
    --windmill_tower-sy1: 0.995;
    --windmill_tower-op1: 1;

    /* resting pose, neutral rotation held by the separate rotation lane */
    --windmill_tower-ty1: 0px;
    --windmill_tower-sy1: 1;
    --windmill_tower-op1: 1;
  }
}

/* Rotation settle keyframes: update rotation lane only.
   - Small ±1.5° wobble timed to the same duration and delay so it reads as part of the same elastic motion.
   - Returns to neutral by the end so tower stays stationary afterward.
*/
@keyframes windmill-tower-rot-settle {

    --windmill_tower-rot1: 0deg;

  20% {
    --windmill_tower-rot1: -1.5deg; /* small initial tilt with the pop */

/* Coherence & performance notes:
   - Entrance uses only GPU-friendly lanes (translate/scale/opacity) and rotates via a single rotation lane.
   - Keyframes only modify custom properties to avoid transform collisions with other animations in the SVG.
   - Delay (820ms) and duration (520ms) chosen so the tower reads after the hill/tree/windmill-base entrances,

/* Windmill blades animation - follows the project's "lanes" pattern.
   - Adds lanes ONCE for blades motion (translate/rotate/scale/opacity lanes).
   - Composer composes transform from lanes (no 'transform' inside @keyframes).
   - Two-stage behaviour:
     1) pop: quick fade+scale pop with a single 20° sweep to imply wind pickup (420ms, ease-out-back-like)
     2) continuous: infinite linear spin (1 rev / 3.2s) starting when the pop begins (delay 980ms)
   - Note: small micro-ramp was considered; to avoid lane collisions and keep behaviour deterministic
     we keep the continuous spin strictly linear and apply the pickup feel in the pop sweep.
   - Will animate immediately on page load (no runtime classes).
*/

/* Declare lanes (add once) */
@property --windmill_blades-tx1 {
  syntax: '<length>';
  inherits: true;
  initial-value: 0px;
}
@property --windmill_blades-ty1 {

  inherits: true;

}
@property --windmill_blades-rot1 {
  syntax: '<angle>';
  inherits: true;
  initial-value: 0deg;
}
@property --windmill_blades-rot2 {
  syntax: '<angle>';
  inherits: true;
  initial-value: 0deg;
}
@property --windmill_blades-sx1 {
  syntax: '<number>';
  inherits: true;
  initial-value: 1;
}
@property --windmill_blades-sy1 {
  syntax: '<number>';
  inherits: true;
  initial-value: 1;
}
@property --windmill_blades-op1 {
  syntax: '<number>';
  inherits: true;
  initial-value: 1;
}

/* Composer for windmill blades.
   - transform composed from lanes so keyframes never write 'transform'.
   - transform-box: fill-box keeps origin in SVG coordinates for consistent results.
   - transform-origin chosen at the blades' geometric center; this keeps rotation centered on the hub.
     If the visual hub needs micro-adjustment, tweak transform-origin slightly (percent values).
*/
.windmill_blades {
  /* initial (pre-pop) lane values */
  --windmill_blades-tx1: 0px;
  --windmill_blades-ty1: 0px;
  --windmill_blades-rot1: 0deg;   /* short pop sweep lane (0→20→0) */
  --windmill_blades-rot2: 0deg;   /* continuous spin lane (0→360deg repeating) */
  --windmill_blades-sx1: 0.6;     /* pop start: scaled down */
  --windmill_blades-sy1: 0.6;
  --windmill_blades-op1: 0;       /* start hidden */

  transform-box: fill-box;
  /* The hub visually sits near the blades group's centre; use 50% 50% (center of element's bbox).
     This reliably centers rotation for typical blade groups. */
  transform-origin: 50% 50%;

  /* Compose transform from lanes; order: translate -> rotate(pop) -> rotate(continuous) -> scale */
  transform: translate(var(--windmill_blades-tx1, 0px), var(--windmill_blades-ty1, 0px))
             rotate(var(--windmill_blades-rot1, 0deg))
             rotate(var(--windmill_blades-rot2, 0deg))
             scale(var(--windmill_blades-sx1, 1), var(--windmill_blades-sy1, 1));
  opacity: var(--windmill_blades-op1, 1);

  will-change: transform, opacity;

  /* Two aligned animations (index 0 = pop; index 1 = continuous spin) */
  animation-name: windmill-blades-pop, windmill-blades-spin;
  animation-duration: 420ms, 3200ms; /* pop then 3.2s per revolution */
  animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1), linear; /* pop easing, steady spin linear */
  animation-delay: 980ms, 980ms; /* both start when the scene is ready (pop start = 980ms) */
  animation-iteration-count: 1, infinite;
  animation-fill-mode: both, both;
  animation-play-state: running, running;
}

/* Pop keyframes: update lanes only (opacity, scale, short sweep via rot1).
   - 60% contains the overshoot sweep and scale to 1.05; 80% settles; 100% final neutral.
   - No 'transform' inside keyframes - we only update custom properties (lanes).
*/
@keyframes windmill-blades-pop {
  0% {
    --windmill_blades-op1: 0;
    --windmill_blades-sx1: 0.6;
    --windmill_blades-sy1: 0.6;
    --windmill_blades-rot1: 0deg;

  60% {

    --windmill_blades-op1: 1;
    --windmill_blades-sx1: 1.05;
    --windmill_blades-sy1: 1.05;
    --windmill_blades-rot1: 20deg;
  }

  80% {
    /* settle back toward final pose */
    --windmill_blades-sx1: 0.995;
    --windmill_blades-sy1: 0.995;
    --windmill_blades-rot1: 2deg;
    --windmill_blades-op1: 1;
  }

  100% {
    /* final: neutral short-sweep lane; continuous rotation lane handles ongoing spin */
    --windmill_blades-op1: 1;
    --windmill_blades-sx1: 1;
    --windmill_blades-sy1: 1;
    --windmill_blades-rot1: 0deg;
  }
}

/* Continuous spin: rotate the rot2 lane from 0 → 360deg (linear) infinitely.
   - Starts at the same delay as pop so motion feels immediate after pickup.
   - Using a dedicated lane for continuous spin avoids collisions with the pop lane (rot1).
*/
@keyframes windmill-blades-spin {
  0% {
    --windmill_blades-rot2: 0deg;
  }
  100% {
    --windmill_blades-rot2: 360deg;

/* Coherence notes:

   - Using custom-property lanes and composing transform in the composer avoids 'transform' in keyframes,

/* Clouds: entrance (staggered) + continuous gentle drift/bob.

   - Stagger: group base delay 1100ms with 120ms between children (left → center → right).
   - Continuous loops: per-cloud drift durations/offsets (left = 8s, center = 9s, right = 7s) with alternate yoyo,

/* --- Add ONCE: lanes for clouds_group --- */
@property --clouds_group-tx2 {
  syntax: '<length>';
  inherits: true;
  initial-value: 0px;

/* Composer rule: composes final transform from lanes.

   - transform-origin chosen near the upper sky area to avoid collisions with trees/windmill blades.
*/
.clouds_group {

  --clouds_group-tx2: 0px;   /* continuous horizontal drift lane (animated separately) */
  --clouds_group-ty2: 0px;   /* continuous vertical bob lane (animated separately) */
  --clouds_group-op1: 0;     /* entrance opacity (0 → 0.95) */

  transform: translateY(var(--clouds_group-ty1, 0px))
             translateX(var(--clouds_group-tx2, 0px))
             translateY(var(--clouds_group-ty2, 0px));
  opacity: var(--clouds_group-op1, 1);

  will-change: transform, opacity;

  /* Two aligned animations per cloud:
     - index 0: entrance (one-shot pop/slide/fade)

     Defaults here are a sensible baseline; specific durations/names/delays are overridden per child to create the requested stagger
     and individual drift parameters (left/center/right).
  */
  animation-name: clouds-entrance, clouds-drift-left;
  animation-duration: 600ms, 8s;
  animation-timing-function: ease-out, ease-in-out;
  animation-delay: 1100ms, 1100ms;
  animation-iteration-count: 1, infinite;
  animation-direction: normal, alternate;
  animation-fill-mode: both, both;
  animation-play-state: running, running;
}

/* Per-child overrides for stagger + per-cloud drift characteristics.
   - The markup contains multiple .clouds_group shapes as children of .clouds_group-group.
   - Left → center → right order is assumed to match document order; if a particular SVG has fewer elements,
     the applicable rules simply won't match unused nth positions.
   - Stagger: 1100ms base + 0ms/120ms/240ms offsets.
*/

/* left cloud (document order: 1) */
.clouds_group-group > .clouds_group:nth-of-type(1) {
  /* entrance starts at 1.1s (base) */
  animation-name: clouds-entrance, clouds-drift-left;
  animation-duration: 600ms, 8s;
  animation-timing-function: ease-out, ease-in-out;
  animation-delay: 1100ms, 1100ms;
  animation-iteration-count: 1, infinite;
  animation-direction: normal, alternate;
  animation-fill-mode: both, both;
}

/* center cloud (document order: 2) */
.clouds_group-group > .clouds_group:nth-of-type(2) {
  /* entrance delayed by 120ms (1.22s), continuous drift uses center parameters */
  animation-name: clouds-entrance, clouds-drift-center;
  animation-duration: 600ms, 9s;
  animation-timing-function: ease-out, ease-in-out;
  animation-delay: 1220ms, 1220ms; /* 1100ms + 120ms stagger */
  animation-iteration-count: 1, infinite;
  animation-direction: normal, alternate;
  animation-fill-mode: both, both;
}

/* right cloud (document order: 3) */
.clouds_group-group > .clouds_group:nth-of-type(3) {
  /* entrance delayed by 240ms (1.34s), continuous drift uses right parameters */
  animation-name: clouds-entrance, clouds-drift-right;
  animation-duration: 600ms, 7s;
  animation-timing-function: ease-out, ease-in-out;
  animation-delay: 1340ms, 1340ms; /* 1100ms + 240ms stagger */
  animation-iteration-count: 1, infinite;
  animation-direction: normal, alternate;
  animation-fill-mode: both, both;
}

/* --- Keyframes (update lanes only) --- */

/* Entrance: slide down from above (-18px → 0) and fade in to 0.95 with a gentle overshoot / settle.
   Avoids writing 'transform' inside keyframes; only updates the lanes.
*/
@keyframes clouds-entrance {
  0% {
    --clouds_group-ty1: -18px;
    --clouds_group-op1: 0;
  }

  60% {
    /* small upward overshoot then become visible (opacity to 0.95) */
    --clouds_group-ty1: -6px;
    --clouds_group-op1: 0.95;
  }

  80% {
    /* gentle settle */
    --clouds_group-ty1: 4px;
    --clouds_group-op1: 0.95;
  }

  100% {
    --clouds_group-ty1: 0px;
    --clouds_group-op1: 0.95;
  }
}

/* Continuous drift + bob for left cloud:
   - Horizontal: 0 → -12px → 0 (approximate one half-wave), with smooth intermediate steps to approximate sine.
   - Vertical bob: small ±4px on the same period.
   - Keyframes update lanes only (no 'transform').
*/
@keyframes clouds-drift-left {
  0% {
    --clouds_group-tx2: 0px;
    --clouds_group-ty2: 0px;
  }
  25% {
    --clouds_group-tx2: -6px;
    --clouds_group-ty2: -2px;
  }
  50% {
    --clouds_group-tx2: -12px;
    --clouds_group-ty2: 0px;
  }
  75% {
    --clouds_group-tx2: -6px;
    --clouds_group-ty2: 2px;
  }
  100% {
    --clouds_group-tx2: 0px;
    --clouds_group-ty2: 0px;
  }
}

/* Continuous drift + bob for center cloud (positive drift).
   - Horizontal: 0 → +10px → 0
   - Vertical bob: ±4px for slightly larger effect in center.
*/
@keyframes clouds-drift-center {
  0% {
    --clouds_group-tx2: 0px;
    --clouds_group-ty2: 0px;
  }
  25% {
    --clouds_group-tx2: 5px;
    --clouds_group-ty2: -2px;
  }
  50% {
    --clouds_group-tx2: 10px;
    --clouds_group-ty2: 0px;
  }
  75% {
    --clouds_group-tx2: 5px;
    --clouds_group-ty2: 2px;
  }
  100% {
    --clouds_group-tx2: 0px;
    --clouds_group-ty2: 0px;
  }
}

/* Continuous drift + bob for right cloud (smaller leftward drift).
   - Horizontal: 0 → -8px → 0
   - Vertical bob: ±3–4px
*/
@keyframes clouds-drift-right {
  0% {
    --clouds_group-tx2: 0px;
    --clouds_group-ty2: 0px;
  }
  25% {
    --clouds_group-tx2: -4px;
    --clouds_group-ty2: -1.5px;
  }
  50% {
    --clouds_group-tx2: -8px;
    --clouds_group-ty2: 0px;
  }
  75% {
    --clouds_group-tx2: -4px;
    --clouds_group-ty2: 1.5px;
  }
  100% {
    --clouds_group-tx2: 0px;
    --clouds_group-ty2: 0px;
  }
}

/* --- Coherence notes (compact) ---
   - Entrance timing (600ms) and group base delay (1.1s) are chosen to complete after the primary hill/tree builds
     so the clouds feel like a finishing touch rather than competing with foreground motion.
   - Stagger (120ms) reads left → center → right and keeps the sky composition balanced.
   - Continuous loops use long durations (7–9s) and alternate to produce a calm, low-frequency sine-like motion.
   - Keyframes only mutate custom properties ("lanes") to avoid transform collisions with the rest of the SVG.
   - All animated properties are GPU-friendly (translate & opacity). will-change kept minimal for performance.
*/

/* sky_background — subtle perpetual motion (no entrance)
   - Adds a very gentle vertical parallax/bob and a slow, tiny brightness pulse so the sky
     feels alive without stealing attention from the foreground animations.
   - Follows the project's "lanes" pattern: keyframes update only custom properties (no 'transform' inside @keyframes).
   - Declarations added ONCE below (lanes + composer). Names chosen to avoid conflicts.
   - Timing chosen to begin after main scene build (≈1.2s) so the sky motion reads as ambient background.
*/

/* Add ONCE: custom-property lanes for sky_background (length + number) */
@property --sky_background-ty2 {
  syntax: '<length>';
  inherits: true;
  initial-value: 0px;
}
@property --sky_background-bright1 {
  syntax: '<number>';
  inherits: true;
  initial-value: 1;
}

/* Composer rule for .sky_background
   - Compose transform from lanes here (translateY). Keyframes must not write 'transform'.
   - transform-box: fill-box so the origin is in SVG coordinates and any tiny motion stays visually coherent.
   - transform-origin centered because the sky is the backdrop circle; small translate is safe and keeps edges aligned.
*/
.sky_background {
  /* default lane values (static by default, animations will update these lanes) */
  --sky_background-ty2: 0px;
  --sky_background-bright1: 1;

  transform-box: fill-box;
  transform-origin: 50% 50%;
  transform: translateY(var(--sky_background-ty2, 0px));
  /* use filter-brightness driven by a lane so we avoid writing filter animation directly into keyframes */
  filter: brightness(var(--sky_background-bright1, 1));

  /* Ambient loops (two aligned animations):
     - index 0: very slow vertical bob/parallax (long alternate loop)
     - index 1: extremely subtle brightness pulse (slower, independent loop)
     Both start after the main scene entrances so they don't clash with one-shot pops.
  */
  animation-name: sky-background-bob, sky-background-brightness;
  animation-duration: 14s, 10s;
  animation-timing-function: ease-in-out, ease-in-out;
  animation-delay: 1200ms, 1200ms;           /* start after primary scene (~1.1s) for coherence */
  animation-iteration-count: infinite, infinite;
  animation-direction: alternate, alternate; /* gentle yoyo behaviour */
  animation-fill-mode: both, both;
  animation-play-state: running, running;

  will-change: transform, filter;
}

/* Keyframes update lanes only — do NOT write 'transform' or 'filter' inside keyframes. */
/* Very slow vertical bob / parallax for the sky (subtle: ±6px) */
@keyframes sky-background-bob {
  0% {
    --sky_background-ty2: 0px;
  }
  50% {
    /* slight upward drift to imply a distant parallax motion (kept very small to avoid revealing edges) */
    --sky_background-ty2: -6px;
  }
  100% {
    --sky_background-ty2: 0px;
  }
}

/* Extremely subtle brightness breathing (1 → 1.03 → 1)
   - Makes the backdrop feel a touch more alive without affecting color fidelity.
   - Kept very small to avoid visible banding and to remain unobtrusive.
*/
@keyframes sky-background-brightness {
  0% {
    --sky_background-bright1: 1;
  }
  50% {
    --sky_background-bright1: 1.03;
  }
  100% {
    --sky_background-bright1: 1;
  }
}

*/
