<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   SVG Animation
  </title>
  <style>
   /*
      Ground base entrance animation (self-contained).
      - Follows "lanes" pattern using custom properties (no 'transform' inside @keyframes).
      - Two coordinated animations:
          1) gb_ground_base_pop: lift + fade + soft overscale (cubic-bezier(0.22,1,0.36,1))
          2) gb_ground_base_wobble: subtle rotation wobble (small, 3% -> -1deg -> 0deg)
      - Transform origin chosen relative to the SVG geometry: center bottom (so the ground feels anchored).
      - Performance: only animates custom properties and opacity. The element's transform is computed once per frame
        from those properties. will-change hints provided for transform + opacity.
      - These @property blocks provide proper typed interpolation and initial values that match the requested
        "initial state" (so the SVG paints in the start pose before animations run).
    */

    /* Typed custom properties (lanes). Added ONCE for the .ground_base composer. */
    @property --ground_base-tx1 {
      syntax: '<length>';
      inherits: false;
      initial-value: 0px;
    }
    @property --ground_base-ty1 {
      syntax: '<length>';
      inherits: false;
      /* initial = element start translated down 60px per spec */
      initial-value: 60px;
    }
    @property --ground_base-rot1 {
      syntax: '<angle>';
      inherits: false;
      initial-value: 0deg;
    }
    @property --ground_base-sx1 {
      syntax: '<number>';
      inherits: false;
      /* initial slight compressed scale per spec */
      initial-value: 0.98;
    }
    @property --ground_base-sy1 {
      syntax: '<number>';
      inherits: false;
      initial-value: 0.98;
    }
    @property --ground_base-op1 {
      syntax: '<number>';
      inherits: false;
      initial-value: 0;
    }

    /*
      Primary pop keyframes: animate translationY, scale, opacity via custom properties.
      NOTE: we never set 'transform' here; only custom properties are animated.
    */
    @keyframes gb_ground_base_pop {
      0% {
        --ground_base-ty1: 60px;
        --ground_base-sx1: 0.98;
        --ground_base-sy1: 0.98;
        --ground_base-op1: 0;
      }
      /* overshoot at 70% */
      70% {
        --ground_base-ty1: 0px;
        --ground_base-sx1: 1.02;
        --ground_base-sy1: 1.02;
        --ground_base-op1: 1;
      }
      100% {
        --ground_base-ty1: 0px;
        --ground_base-sx1: 1;
        --ground_base-sy1: 1;
        --ground_base-op1: 1;
      }
    }

    /*
      Subtle wobble: tiny rotation to avoid perfectly rigid motion.
      - 3% -> -1deg (quick tilt), rest returns to 0deg by 100%.
      - Kept small to be unobtrusive.
    */
    @keyframes gb_ground_base_wobble {
      0% {
        --ground_base-rot1: 0deg;
      }
      3% {
        --ground_base-rot1: -1deg;
      }
      100% {
        --ground_base-rot1: 0deg;
      }
    }

    /*
      Composer rule for the SVG element with class 'ground_base'.
      - Sets transform using the animated custom properties.
      - transform-box + transform-origin are set so the origin matches the visible shape (center bottom).
      - Both animations are declared using longhand properties, aligned by index.
    */
    .ground_base {
      /* ensure initial visual state matches the @property initial-values (helps first paint) */
      --ground_base-tx1: 0px;
      --ground_base-ty1: 60px;
      --ground_base-rot1: 0deg;
      --ground_base-sx1: 0.98;
      --ground_base-sy1: 0.98;
      --ground_base-op1: 0;

      /* Use transform-box so transforms reference the element's fill-box geometry inside the SVG */
      transform-box: fill-box;
      transform-origin: 50% 100%; /* center bottom - anchors the lift to the bottom edge */

      /* Compose the transform from the custom-property lanes (no transform in keyframes). */
      transform:
        translate(var(--ground_base-tx1, 0px), var(--ground_base-ty1, 0px))
        rotate(var(--ground_base-rot1, 0deg))
        scale(var(--ground_base-sx1, 1), var(--ground_base-sy1, 1));

      /* Opacity follows the lane var; keep the real opacity in the rule so paints update */
      opacity: var(--ground_base-op1, 1);

      /* Hints for the browser: transform + opacity are the animated properties (keeps it performant) */
      will-change: transform, opacity;

      /*
        Two animations applied simultaneously.
        Index alignment:
          - animation-name:            pop,              wobble
          - animation-duration:        700ms,            700ms
          - animation-timing-function: cubic-bezier(...), cubic-bezier(...)
          - animation-delay:           0ms,              0ms
          - animation-iteration-count: 1,                1
          - animation-fill-mode:       forwards,         forwards
      */
      animation-name: gb_ground_base_pop, gb_ground_base_wobble;
      animation-duration: 700ms, 700ms;
      animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1), cubic-bezier(0.22, 1, 0.36, 1);
      animation-delay: 0ms, 0ms;
      animation-iteration-count: 1, 1;
      animation-fill-mode: forwards, forwards;
      animation-direction: normal, normal;
      animation-play-state: running, running;
    }

    /* Additional note:
       - If other animations exist for .ground_base, these lanes were placed on the next free lanes:
         ty1, sx1, sy1, rot1, op1. If later expansions are needed (e.g., a second translation lane),
         follow the same naming convention (--ground_base-tx2, --ground_base-ty2, etc.).
    */

/* 
  Animations for the small center-bottom plant (.foreground_plant_center).
  - Uses the "lanes" pattern: custom properties (typed via @property) are animated in @keyframes.
  - No 'transform' inside keyframes — the transform is composed in the element rule from the lanes.
  - This block is self-contained and will animate on page load; no runtime classes required.
  - Timing is staggered relative to .ground_base (ground_base starts immediately; this plant is delayed 120ms).
*/

/* Typed custom properties for the plant. Added once for this composer. */
@property --foreground_plant_center-tx1 {
  syntax: '<length>';
  inherits: false;
  initial-value: 0px;
}
@property --foreground_plant_center-ty1 {
  syntax: '<length>';
  inherits: false;
  /* initial state: rendered translated down 36px (so it can "pop" into place) */
  initial-value: 36px;
}
@property --foreground_plant_center-rot1 {
  syntax: '<angle>';
  inherits: false;
  initial-value: 0deg;
}
@property --foreground_plant_center-sx1 {
  syntax: '<number>';
  inherits: false;
  /* initial compressed scale (0.6) per design */
  initial-value: 0.6;
}
@property --foreground_plant_center-sy1 {
  syntax: '<number>';
  inherits: false;
  initial-value: 0.6;
}
@property --foreground_plant_center-op1 {
  syntax: '<number>';
  inherits: false;
  initial-value: 0;
}

/* 
  Pop-and-bounce keyframes.
  - Animates ty1 (vertical lane), sx1/sy1 (scale lanes), op1 (opacity lane).
  - Sequence follows the plan: scale 0.6 -> 1.12 (55%) -> 0.98 (85%) -> 1 (100%).
  - Vertical lane includes a tiny upward overshoot (negative ty) and a soft settle bounce
    so the motion feels organic. Opacity fades in to 1.
*/
@keyframes fpc_pop {
  0% {
    --foreground_plant_center-ty1: 36px;
    --foreground_plant_center-sx1: 0.6;
    --foreground_plant_center-sy1: 0.6;
    --foreground_plant_center-op1: 0;
  }
  /* early climb + beginning of scale-up */
  30% {
    --foreground_plant_center-ty1: 6px;    /* rising toward final position */
    --foreground_plant_center-sx1: 0.9;
    --foreground_plant_center-sy1: 0.9;
    --foreground_plant_center-op1: 0.6;
  }
  /* peak of bounce / slight upward overshoot to add liveliness */
  55% {
    --foreground_plant_center-ty1: -6px;   /* small upward overshoot */
    --foreground_plant_center-sx1: 1.12;
    --foreground_plant_center-sy1: 1.12;
    --foreground_plant_center-op1: 1;
  }
  /* recoil slightly below resting point */
  85% {
    --foreground_plant_center-ty1: 4px;
    --foreground_plant_center-sx1: 0.98;
    --foreground_plant_center-sy1: 0.98;
    --foreground_plant_center-op1: 1;
  }
  /* final settled pose */
  100% {
    --foreground_plant_center-ty1: 0px;
    --foreground_plant_center-sx1: 1;
    --foreground_plant_center-sy1: 1;
    --foreground_plant_center-op1: 1;
  }
}

/* 
  Subtle rotation wobble to avoid rigid motion.
  - Very small angle changes that finish at 0deg.
  - Kept subtle so the plant reads natural with other nearby motion (ground wobble).
*/
@keyframes fpc_wobble {
  0% {
    --foreground_plant_center-rot1: 0deg;
  }
  25% {
    --foreground_plant_center-rot1: -3deg;
  }
  60% {
    --foreground_plant_center-rot1: 1.2deg;
  }
  100% {
    --foreground_plant_center-rot1: 0deg;
  }
}

/* Composer rule for the plant element. 
   - Uses the lanes produced above to compute the actual transform and opacity.
   - transform-box + transform-origin chosen so the plant lifts from its bottom center.
   - Animation timing is intentionally staggered (delay: 120ms) so the plant follows the ground_base entrance.
*/
.foreground_plant_center {
  /* ensure initial visual state matches the @property initial-values (helps first paint) */
  --foreground_plant_center-tx1: 0px;
  --foreground_plant_center-ty1: 36px;
  --foreground_plant_center-rot1: 0deg;
  --foreground_plant_center-sx1: 0.6;
  --foreground_plant_center-sy1: 0.6;
  --foreground_plant_center-op1: 0;

  /* Make transforms relative to the plant's fill geometry and anchor at its bottom center */
  transform-box: fill-box;
  transform-origin: 50% 100%;

  /* Compose transform from lanes (no transform in keyframes) */
  transform:
    translate(var(--foreground_plant_center-tx1, 0px), var(--foreground_plant_center-ty1, 0px))
    rotate(var(--foreground_plant_center-rot1, 0deg))
    scale(var(--foreground_plant_center-sx1, 1), var(--foreground_plant_center-sy1, 1));

  opacity: var(--foreground_plant_center-op1, 1);

  /* Performance hint: only transform & opacity change. */
  will-change: transform, opacity;

  /* Two coordinated animations: pop (motion + opacity) + wobble (tiny rotation) */
  animation-name: fpc_pop, fpc_wobble;
  animation-duration: 520ms, 520ms;
  animation-timing-function: cubic-bezier(0.17, 0.9, 0.32, 1), ease-in-out;
  animation-delay: 120ms, 120ms; /* staggered after ground_base (which starts immediately) */
  animation-iteration-count: 1, 1;
  animation-fill-mode: forwards, forwards;
  animation-direction: normal, normal;
  animation-play-state: running, running;
}

/* Notes:
   - Lane names used: ty1, sx1, sy1, rot1, op1 (placed on the first available lanes for this element).
   - This plant's animation intentionally starts 120ms after .ground_base's entrance to create a natural cascade.
   - The keyframes animate only custom properties (lanes). The computed transform in the composer rule keeps animation work efficient.
*/

/* Foreground plant (left) entrance — lanes pattern, self-contained.
   - Matches the style and performance constraints used for other plants (foreground_plant_center).
   - Uses typed @property custom properties (lanes). Keyframes animate only these vars;
     the element's rule composes the real transform from the lanes (no transform inside keyframes).
   - Timing chosen to sit harmoniously with existing elements:
       duration: 620ms, delay: 160ms (so it follows ground_base and the center plant).
   - Small horizontal micro-shift (-6px → 0) gives this left plant a slightly different feel.
   - Wobble animation included as a second lane (tiny rotation) to avoid rigid motion.
   - Lane names placed on the first available lanes for this element: tx1, ty1, rot1, sx1, sy1, op1.
   - This block is safe to drop into the existing stylesheet — it does NOT modify existing rules.
*/

/* Typed custom properties (lanes) for .foreground_plant_left (add ONCE). */
@property --foreground_plant_left-tx1 {
  syntax: '<length>';
  inherits: false;
  initial-value: -6px; /* initial micro-offset to the left */
}
@property --foreground_plant_left-ty1 {
  syntax: '<length>';
  inherits: false;
  initial-value: 44px; /* element starts translated down 44px */
}
@property --foreground_plant_left-rot1 {
  syntax: '<angle>';
  inherits: false;
  initial-value: 0deg;
}
@property --foreground_plant_left-sx1 {
  syntax: '<number>';
  inherits: false;
  initial-value: 0.56; /* initial compressed scale */
}
@property --foreground_plant_left-sy1 {
  syntax: '<number>';
  inherits: false;
  initial-value: 0.56;
}
@property --foreground_plant_left-op1 {
  syntax: '<number>';
  inherits: false;
  initial-value: 0; /* starts invisible */
}

/* Pop motion: vertical lane, horizontal micro-shift, scale lanes and opacity.
   IMPORTANT: no 'transform' written here — only the lane properties are animated. */
@keyframes fpl_pop {
  0% {
    --foreground_plant_left-ty1: 44px;
    --foreground_plant_left-tx1: -6px;
    --foreground_plant_left-sx1: 0.56;
    --foreground_plant_left-sy1: 0.56;
    --foreground_plant_left-op1: 0;
  }
  30% {
    /* rising and beginning of scale-up; appear gradually */
    --foreground_plant_left-ty1: 12px;
    --foreground_plant_left-tx1: -3.2px;
    --foreground_plant_left-sx1: 0.9;
    --foreground_plant_left-sy1: 0.9;
    --foreground_plant_left-op1: 0.6;
  }
  55% {
    /* soft upward overshoot + scale overshoot for a bouncy pop */
    --foreground_plant_left-ty1: -4px;
    --foreground_plant_left-tx1: -1px;
    --foreground_plant_left-sx1: 1.05;
    --foreground_plant_left-sy1: 1.05;
    --foreground_plant_left-op1: 1;
  }
  85% {
    /* settle slightly below final to make the motion organic */
    --foreground_plant_left-ty1: 4px;
    --foreground_plant_left-tx1: -0.25px;
    --foreground_plant_left-sx1: 0.98;
    --foreground_plant_left-sy1: 0.98;
    --foreground_plant_left-op1: 1;
  }
  100% {
    /* final pose: anchored at the element's bottom center */
    --foreground_plant_left-ty1: 0px;
    --foreground_plant_left-tx1: 0px;
    --foreground_plant_left-sx1: 1;
    --foreground_plant_left-sy1: 1;
    --foreground_plant_left-op1: 1;
  }
}

/* Tiny rotation wobble so the plant doesn't look mechanically rigid.
   Leaves final rotation at 0deg. */
@keyframes fpl_wobble {
  0% {
    --foreground_plant_left-rot1: 0deg;
  }
  25% {
    --foreground_plant_left-rot1: -2.2deg;
  }
  60% {
    --foreground_plant_left-rot1: 1deg;
  }
  100% {
    --foreground_plant_left-rot1: 0deg;
  }
}

/* Composer rule for the SVG element with class 'foreground_plant_left'.
   - Composes the transform from the lane variables (single place to update transform).
   - Uses transform-box: fill-box and transform-origin: center bottom so the plant lifts naturally.
   - Animations declared using longhand with aligned indices for multiple animations.
*/
.foreground_plant_left {
  /* make sure the element paints in the declared initial pose (helps first paint) */
  --foreground_plant_left-tx1: -6px;
  --foreground_plant_left-ty1: 44px;
  --foreground_plant_left-rot1: 0deg;
  --foreground_plant_left-sx1: 0.56;
  --foreground_plant_left-sy1: 0.56;
  --foreground_plant_left-op1: 0;

  /* transforms reference the element's fill geometry and anchor at bottom center */
  transform-box: fill-box;
  transform-origin: 50% 100%;

  /* Compose the transform from the lanes (no transform inside keyframes). */
  transform:
    translate(var(--foreground_plant_left-tx1, 0px), var(--foreground_plant_left-ty1, 0px))
    rotate(var(--foreground_plant_left-rot1, 0deg))
    scale(var(--foreground_plant_left-sx1, 1), var(--foreground_plant_left-sy1, 1));

  opacity: var(--foreground_plant_left-op1, 1);

  /* Hint to the browser for optimal compositing */
  will-change: transform, opacity;

  /* Two coordinated animations:
     Index alignment (pop, wobble)
     - names
     - durations: same for both to keep timing predictable
     - timing functions aligned: pop uses the requested cubic-bezier, wobble uses softer ease
     - delays: 160ms for both (staggered after center plant which used 120ms)
  */
  animation-name: fpl_pop, fpl_wobble;
  animation-duration: 620ms, 620ms;
  animation-timing-function: cubic-bezier(0.17, 0.9, 0.32, 1), ease-in-out;
  animation-delay: 160ms, 160ms;
  animation-iteration-count: 1, 1;
  animation-fill-mode: forwards, forwards;
  animation-direction: normal, normal;
  animation-play-state: running, running;
}

/* Notes:
   - This block intentionally mirrors the same lane-based approach used for foreground_plant_center,
     so all plant animations stay consistent and efficient.
   - The horizontal micro-shift is small and returns to zero at 100% to avoid any long-term layout drift.
   - All heavy paint/stroke/blur effects are avoided; only transform & opacity are animated for best performance.
*/

/* foreground_plant_right — lane-based entrance animation
   - Self-contained: adds typed @property lanes and composer rule ONCE for .foreground_plant_right.
   - Mirrors the left plant's motion but with a small positive horizontal micro-shift (6px → 0).
   - Timing chosen to sit harmoniously with other elements:
       duration: 600ms, delay: 180ms (so it follows ground and other plants).
   - Performance: keyframes animate only custom properties (lanes). The composed transform is in the composer rule.
   - Collision avoidance: small vertical/horizontal values and transform-origin center-bottom keep motion local
     so the plant doesn't clip or collide with larger shapes (hills/ground).
*/

/* Typed lanes for foreground_plant_right (add ONCE). We use the "first free lanes":
   tx1, ty1, rot1, sx1, sy1, op1
*/
@property --foreground_plant_right-tx1 {
  syntax: '<length>';
  inherits: false;
  initial-value: 6px; /* small positive micro-shift to the right as described */
}
@property --foreground_plant_right-ty1 {
  syntax: '<length>';
  inherits: false;
  initial-value: 40px; /* starts translated down 40px */
}
@property --foreground_plant_right-rot1 {
  syntax: '<angle>';
  inherits: false;
  initial-value: 0deg;
}
@property --foreground_plant_right-sx1 {
  syntax: '<number>';
  inherits: false;
  initial-value: 0.58; /* initial compressed scale */
}
@property --foreground_plant_right-sy1 {
  syntax: '<number>';
  inherits: false;
  initial-value: 0.58;
}
@property --foreground_plant_right-op1 {
  syntax: '<number>';
  inherits: false;
  initial-value: 0; /* starts invisible */
}

/* Pop / bounce keyframes for the right plant.
   NOTE: we only animate the custom properties (lanes). Never write 'transform' here.
   The timing curve for the main pop matches other plants: cubic-bezier(...) for a snappy organic pop.
*/
@keyframes fpr_pop {
  0% {
    --foreground_plant_right-ty1: 40px;
    --foreground_plant_right-tx1: 6px;
    --foreground_plant_right-sx1: 0.58;
    --foreground_plant_right-sy1: 0.58;
    --foreground_plant_right-op1: 0;
  }
  30% {
    /* rising and beginning of scale-up; appear gradually */
    --foreground_plant_right-ty1: 12px;
    --foreground_plant_right-tx1: 3.2px;
    --foreground_plant_right-sx1: 0.9;
    --foreground_plant_right-sy1: 0.9;
    --foreground_plant_right-op1: 0.6;
  }
  55% {
    /* soft upward overshoot + scale overshoot for a bouncy pop */
    --foreground_plant_right-ty1: -4px;
    --foreground_plant_right-tx1: 1px;
    --foreground_plant_right-sx1: 1.05;
    --foreground_plant_right-sy1: 1.05;
    --foreground_plant_right-op1: 1;
  }
  85% {
    /* settle slightly below final to make the motion organic */
    --foreground_plant_right-ty1: 4px;
    --foreground_plant_right-tx1: 0.25px;
    --foreground_plant_right-sx1: 0.98;
    --foreground_plant_right-sy1: 0.98;
    --foreground_plant_right-op1: 1;
  }
  100% {
    /* final anchored pose (center bottom origin) */
    --foreground_plant_right-ty1: 0px;
    --foreground_plant_right-tx1: 0px;
    --foreground_plant_right-sx1: 1;
    --foreground_plant_right-sy1: 1;
    --foreground_plant_right-op1: 1;
  }
}

/* Small rotation wobble to avoid rigid motion; very subtle and finishes at 0deg.
   Kept separate so we maintain fine control and can keep keyframe complexity low.
*/
@keyframes fpr_wobble {
  0%   { --foreground_plant_right-rot1: 0deg; }
  25%  { --foreground_plant_right-rot1: -2.0deg; }
  60%  { --foreground_plant_right-rot1: 1deg; }
  100% { --foreground_plant_right-rot1: 0deg; }
}

/* Composer rule for the .foreground_plant_right SVG element.
   - Ensures initial paint state matches @property initial-values.
   - Composes transform from lanes (so no transform appears in keyframes).
   - Uses transform-box: fill-box and transform-origin: center bottom so the plant lifts naturally.
   - Two coordinated animations applied with aligned indexes: pop (motion + opacity), wobble (rotation).
*/
.foreground_plant_right {
  /* match the @property initial values for first-paint correctness */
  --foreground_plant_right-tx1: 6px;
  --foreground_plant_right-ty1: 40px;
  --foreground_plant_right-rot1: 0deg;
  --foreground_plant_right-sx1: 0.58;
  --foreground_plant_right-sy1: 0.58;
  --foreground_plant_right-op1: 0;

  /* Transforms reference the element's fill geometry and anchor at bottom center */
  transform-box: fill-box;
  transform-origin: 50% 100%;

  /* Compose the transform from lanes (single source of truth for runtime transforms). */
  transform:
    translate(var(--foreground_plant_right-tx1, 0px), var(--foreground_plant_right-ty1, 0px))
    rotate(var(--foreground_plant_right-rot1, 0deg))
    scale(var(--foreground_plant_right-sx1, 1), var(--foreground_plant_right-sy1, 1));

  /* Opacity follows the lane variable so it is animated without painting extra properties */
  opacity: var(--foreground_plant_right-op1, 1);

  /* Hint the browser for efficient compositing */
  will-change: transform, opacity;

  /* Two coordinated animations (index-aligned):
     1) fpr_pop  — motion + opacity (600ms, cubic-bezier(...), delayed 180ms)
     2) fpr_wobble — small rotation (600ms, ease-in-out, delayed 180ms)
  */
  animation-name: fpr_pop, fpr_wobble;
  animation-duration: 600ms, 600ms;
  animation-timing-function: cubic-bezier(0.17, 0.9, 0.32, 1), ease-in-out;
  animation-delay: 180ms, 180ms;
  animation-iteration-count: 1, 1;
  animation-fill-mode: forwards, forwards;
  animation-direction: normal, normal;
  animation-play-state: running, running;
}

/* Notes:
   - This block intentionally mirrors the left plant's behaviour but mirrored horizontally (positive tx → 0)
     so the three small plants read as a cohesive group with staggered entrances (center at 120ms, left at 160ms, right at 180ms).
   - We animate only lightweight properties (custom properties mapped to transform & opacity) for best performance.
   - If additional motion lanes are needed later (e.g., secondary micro-bounce), follow the existing naming pattern
     (--foreground_plant_right-tx2, --foreground_plant_right-ty2, etc.) and compose them in the same single transform rule.
*/

/* hill_left — lane-based entrance animation
   - Purpose: slide-and-rise with a soft skew + subtle overscale bounce so the left turquoise hill
     reads as a lively background element without colliding with foreground plants or ground.
   - Timing: 760ms duration, starts at 260ms (stagger further by +40ms per extra left-subshape if needed).
   - Easing: cubic-bezier(0.2, 0.9, 0.2, 1) (snappy but smooth).
   - Performance: keyframes animate only typed custom properties (lanes). The actual transform is composed
     once in the .hill_left composer rule (no 'transform' inside @keyframes).
   - Transform origin: center bottom (so the hill rises from ground level and does not visually slip).
   - Notes on collision avoidance: translate/scale/skew values are modest and anchored to the element's
     fill-box. This keeps motion local (no layout shifts) and avoids clipping with foreground plants / ground.
*/

/* Typed lanes for .hill_left (add ONCE).
   - We place new motion lanes on the first free lanes for this element:

  inherits: false;
  initial-value: 0px;
}
@property --hill_left-ty1 {
  syntax: '<length>';
  inherits: false;
  /* initial state: pushed down so it can slide up into place */
  initial-value: 80px;
}
@property --hill_left-rot1 {
  syntax: '<angle>';
  inherits: false;
  initial-value: 0deg;
}
@property --hill_left-sx1 {
  syntax: '<number>';

@property --hill_left-sy1 {
  syntax: '<number>';
  inherits: false;
  initial-value: 0.9;
}
@property --hill_left-skew1 {
  syntax: '<angle>';

  /* soft initial skewX to add a subtle perspective */
  initial-value: -2deg;
}
@property --hill_left-op1 {
  syntax: '<number>';
  inherits: false;
  initial-value: 0;

/* Main pop/bounce animation (only animates lane vars).
   - Sequence:
     0%: offscreen-ish (ty1=80px), small scale (0.9), invisible
     60%: near final vertical position with overscale (1.03) and slight upward overshoot (negative ty1)
     85%: recoil to slightly underscale (0.99)
     100%: settle at neutral scale 1, ty1=0, fully visible
*/
@keyframes hill_left_pop_760 {
  0% {
    --hill_left-ty1: 80px;
    --hill_left-sx1: 0.9;
    --hill_left-sy1: 0.9;
    --hill_left-op1: 0;
  }
  40% {
    /* moving up and becoming visible */
    --hill_left-ty1: 20px;
    --hill_left-sx1: 0.98;
    --hill_left-sy1: 0.98;
    --hill_left-op1: 0.6;
  }
  60% {
    /* gentle overshoot and largest scale */
    --hill_left-ty1: -8px;      /* tiny upward overshoot to feel lively */
    --hill_left-sx1: 1.03;      /* overscale for bounce feeling */
    --hill_left-sy1: 1.03;
    --hill_left-op1: 1;
  }
  85% {
    /* recoil slightly smaller than final to simulate settling */
    --hill_left-ty1: 4px;
    --hill_left-sx1: 0.99;
    --hill_left-sy1: 0.99;
    --hill_left-op1: 1;
  }
  100% {
    --hill_left-ty1: 0px;
    --hill_left-sx1: 1;
    --hill_left-sy1: 1;
    --hill_left-op1: 1;
  }
}

/* Soft skew unwind so the hill doesn't look rigid.
   - Very small skew animation from -2deg -> small positive -> 0deg for a natural settling.
   - Kept separate so the pop keyframe remains focused on position/scale/opacity.
*/
@keyframes hill_left_skew_760 {
  0% {
    --hill_left-skew1: -2deg;
  }
  35% {
    --hill_left-skew1: -0.6deg;
  }
  70% {
    --hill_left-skew1: 0.5deg;
  }
  100% {
    --hill_left-skew1: 0deg;
  }
}

/* Composer rule for the .hill_left SVG element.
   - Composes the final transform from the lane variables (single source of truth).
   - transform-box: fill-box ensures transforms are relative to the element's shape inside the SVG.
   - transform-origin anchored at bottom-center to avoid drifting relative to the ground.
   - Two coordinated animations (pop + skew) applied with aligned indices.
*/
.hill_left {
  /* ensure element paints in the declared initial pose to avoid flicker on first paint */
  --hill_left-tx1: 0px;
  --hill_left-ty1: 80px;
  --hill_left-rot1: 0deg;
  --hill_left-sx1: 0.9;
  --hill_left-sy1: 0.9;
  --hill_left-skew1: -2deg;
  --hill_left-op1: 0;

  /* Make transforms relative to the element's geometry and anchor at its bottom center
     so the hill rises from the same baseline as the foreground plants and ground. */
  transform-box: fill-box;
  transform-origin: 50% 100%;

  /* Compose the transform from lanes (no transform inside keyframes). 
     Note: skewX is used for the soft perspective; rotate lane is available for future uses. */
  transform:
    translate(var(--hill_left-tx1, 0px), var(--hill_left-ty1, 0px))
    skewX(var(--hill_left-skew1, 0deg))
    rotate(var(--hill_left-rot1, 0deg))
    scale(var(--hill_left-sx1, 1), var(--hill_left-sy1, 1));

  /* Opacity follows the lane so fade-in is GPU-friendly. */
  opacity: var(--hill_left-op1, 1);

  /* Hint to the browser which properties will change. Keep this tight for better compositing. */
  will-change: transform, opacity;

  /* Two coordinated animations:
     Index alignment:
       - 0: pop (position/scale/opacity)
       - 1: skew (tiny perspective settle)
     Delay: base 260ms to follow ground and plants. If you have multiple left-subshapes
     and want a small cascading effect, increase the delay per element by ~40ms
     (e.g. 260ms, 300ms, 340ms ...). See note below.
  */
  animation-name: hill_left_pop_760, hill_left_skew_760;
  animation-duration: 760ms, 760ms;
  animation-timing-function: cubic-bezier(0.2, 0.9, 0.2, 1), cubic-bezier(0.2, 0.9, 0.2, 1);
  animation-delay: 260ms, 260ms;
  animation-iteration-count: 1, 1;
  animation-fill-mode: forwards, forwards;
  animation-direction: normal, normal;
  animation-play-state: running, running;
}

/* Stagger hint (optional):
   If your SVG contains multiple left-subshapes and you want them to appear with a 40ms cascade,
   add rules like the following (uncomment/adapt as needed):

   .hill_left:nth-of-type(2) { animation-delay: 300ms, 300ms; }
   .hill_left:nth-of-type(3) { animation-delay: 340ms, 340ms; }

   This keeps the core animation self-contained while enabling a small organic stagger when needed.
*/

  initial-value: 0px;

     55%  : arrive with an overscale (1.08) + slight upward overshoot to convey energy
     85%  : soft recoil to 0.98
     100% : settle at scale 1, ty=0, opacity=1
   Note: values chosen to avoid visual collision with foreground plants and hill_left (kept modest).
*/

  0% {
    --hill_front-ty1: 100px;
    --hill_front-sx1: 0.88;
    --hill_front-sy1: 0.88;
    --hill_front-op1: 0;
  }
  35% {

    --hill_front-sx1: 0.96;
    --hill_front-sy1: 0.96;
    --hill_front-op1: 0.6;
  }
  55% {

    --hill_front-sx1: 1.08;
    --hill_front-sy1: 1.08;
    --hill_front-op1: 1;
  }
  85% {

    --hill_front-ty1: 6px;
    --hill_front-sx1: 0.98;
    --hill_front-sy1: 0.98;
    --hill_front-op1: 1;
  }
  100% {
    --hill_front-ty1: 0px;
    --hill_front-sx1: 1;
    --hill_front-sy1: 1;
    --hill_front-op1: 1;
  }

/* Small rotation settle: hold the gentle 2deg tilt until the very end, then unwind to 0deg

   Kept separate so we don't complicate the main pop timeline.

  }
  100% {
    --hill_front-rot1: 0deg;

/* Composer rule for .hill_front
   - Ensures first paint matches @property initial-values.
   - Composes the final transform from the lane variables (single place to update transform).
   - transform-box: fill-box + transform-origin: center bottom (anchored to baseline).
   - Two coordinated animations applied using longhand with aligned indexes.
*/
.hill_front {
  /* Mirror the @property initial-values so the element paints in the declared start pose */
  --hill_front-tx1: 0px;
  --hill_front-ty1: 100px;
  --hill_front-rot1: 2deg;
  --hill_front-sx1: 0.88;
  --hill_front-sy1: 0.88;
  --hill_front-op1: 0;

  /* Make transforms relative to the element's fill geometry and anchor at its bottom center */
  transform-box: fill-box;
  transform-origin: 50% 100%;

  /* Compose the transform from lanes (no transform inside keyframes) */
  transform:
    translate(var(--hill_front-tx1, 0px), var(--hill_front-ty1, 0px))
    rotate(var(--hill_front-rot1, 0deg))
    scale(var(--hill_front-sx1, 1), var(--hill_front-sy1, 1));

  /* Opacity driven from lane var (keeps animated properties GPU friendly) */
  opacity: var(--hill_front-op1, 1);

  /* Performance hint: only transform & opacity are animated */
  will-change: transform, opacity;

  /* Two coordinated animations:
     - Index 0: hf_pop_820  — motion + opacity (primary)
     - Index 1: hf_settle_rot_820 — small rotation settle
     Both start after hill_left (260ms) with an additional offset so the foreground hill arrives slightly later.
  */
  animation-name: hf_pop_820, hf_settle_rot_820;
  animation-duration: 820ms, 820ms;
  animation-timing-function: cubic-bezier(0.2, 1, 0.22, 1), ease-in-out;
  animation-delay: 320ms, 320ms;
  animation-iteration-count: 1, 1;
  animation-fill-mode: forwards, forwards;
  animation-direction: normal, normal;
  animation-play-state: running, running;
}

/* Notes on collision avoidance & coherence:
   - translateY and scale values are chosen to be modest and anchored to the bottom center so the hill
     doesn't intersect foreground plants or the ground during animation.
   - The pop timing (820ms, delayed 320ms) follows the other entrance animations (ground + plants + hill_left)
     so the composition reads as a cohesive staged arrival.
   - Only custom properties and opacity are animated; the computed transform is applied in one place (the composer rule).
     This keeps the animation performant even in complex SVGs.
*/

     - easing: ease-out (soft stop)
     - delay: 520ms to follow .hill_left (which animates starting at 260ms)

  animation-iteration-count: 1;
